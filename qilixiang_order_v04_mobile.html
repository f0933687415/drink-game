<!doctype html><html lang=zh-Hant><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>七里香大同店｜點餐測試</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f4ec;color:#292622;font-family:-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:white;padding:14px;border-bottom:1px solid #ddd}header b{font-size:23px}#badge{float:right;background:#8d332d;color:white;padding:8px 11px;border-radius:20px}main,#cart{max-width:720px;margin:auto;padding:12px}main{padding-bottom:90px}h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:22px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.drink{min-height:70px;text-align:left;border:1px solid #e1d8ca;background:white;border-radius:14px;padding:12px;font-size:14px}.drink em{display:block;color:#96362f;font-style:normal;font-weight:bold;margin-top:7px}dialog{width:min(94%,520px);border:0;border-radius:18px;padding:0}dialog::backdrop{background:#0008}.box{padding:17px}.box h3{font-size:22px;margin:0 0 8px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}label input{display:none}label span{display:block;text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px 2px;font-size:12px}label input:checked+span{border:2px solid #96362f;color:#96362f;background:#fff2ee}.qty{display:flex;gap:15px;align-items:center;margin:10px 0}.qty button{width:42px;height:42px;border:0;border-radius:50%;font-size:20px}#add,#share{width:100%;border:0;border-radius:12px;padding:14px;background:#8d332d;color:white;font-weight:bold;font-size:16px}#close{float:right;border:0;background:#eee;border-radius:20px;width:34px;height:34px}.line{background:white;border:1px solid #e1d8ca;border-radius:12px;padding:11px;margin:7px 0}.line button{float:right}.meta{font-size:13px;color:#666;margin:4px 0}#sum{font-size:20px;font-weight:bold;text-align:right;margin:12px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.bottom #bar{display:block;width:100%;max-width:720px;margin:auto;text-align:center;color:white;background:#8d332d;padding:15px;border:0;border-radius:13px;font-weight:bold;font-size:17px}
</style></head><body><header><b>七里香</b> <small>高雄大同店｜功能測試</small><span id=badge>0杯 $0</span></header><main><h1>今天想喝什麼？</h1><small>點飲料 → 選甜度冰塊加料 → 加入訂單</small><section><h2>🔥 熱門推薦</h2><div class=grid><button class="drink" data-n="茉香綠茶" data-p="30"><b>茉香綠茶</b><em>$30</em></button><button class="drink" data-n="高山青茶" data-p="30"><b>高山青茶</b><em>$30</em></button><button class="drink" data-n="桂花青茶" data-p="30"><b>桂花青茶</b><em>$30</em></button><button class="drink" data-n="雙色珍珠奶茶" data-p="55"><b>雙色珍珠奶茶</b><em>$55</em></button><button class="drink" data-n="珍珠鮮奶茶" data-p="65"><b>珍珠鮮奶茶</b><em>$65</em></button><button class="drink" data-n="寒天仙冬冰茶" data-p="55"><b>寒天仙冬冰茶</b><em>$55</em></button><button class="drink" data-n="香橙百香綠" data-p="70"><b>香橙百香綠</b><em>$70</em></button><button class="drink" data-n="鮮果百香綠" data-p="65"><b>鮮果百香綠</b><em>$65</em></button><button class="drink" data-n="西瓜汁" data-p="40"><b>西瓜汁</b><em>$40</em></button><button class="drink" data-n="水果茶" data-p="70"><b>水果茶</b><em>$70</em></button></div></section><section><h2>純茶本味</h2><div class=grid><button class="drink" data-n="古早味紅茶" data-p="30"><b>古早味紅茶</b><em>$30</em></button><button class="drink" data-n="茉香綠茶" data-p="30"><b>茉香綠茶</b><em>$30</em></button><button class="drink" data-n="高山青茶" data-p="30"><b>高山青茶</b><em>$30</em></button><button class="drink" data-n="桂花青茶" data-p="30"><b>桂花青茶</b><em>$30</em></button><button class="drink" data-n="烏龍綠茶" data-p="30"><b>烏龍綠茶</b><em>$30</em></button><button class="drink" data-n="決明大麥" data-p="30"><b>決明大麥</b><em>$30</em></button><button class="drink" data-n="黃金烏龍茶（冷泡）" data-p="35"><b>黃金烏龍茶（冷泡）</b><em>$35</em></button><button class="drink" data-n="紅玉紅茶" data-p="35"><b>紅玉紅茶</b><em>$35</em></button><button class="drink" data-n="蕎麥茶" data-p="35"><b>蕎麥茶</b><em>$35</em></button><button class="drink" data-n="日式玄米茶" data-p="35"><b>日式玄米茶</b><em>$35</em></button><button class="drink" data-n="仙草甘茶" data-p="40"><b>仙草甘茶</b><em>$40</em></button></div></section><section><h2>奶茶・鮮奶</h2><div class=grid><button class="drink" data-n="奶茶／綠／青" data-p="45"><b>奶茶／綠／青</b><em>$45</em></button><button class="drink" data-n="黑糖奶茶" data-p="50"><b>黑糖奶茶</b><em>$50</em></button><button class="drink" data-n="日式玄米奶" data-p="50"><b>日式玄米奶</b><em>$50</em></button><button class="drink" data-n="烏龍奶茶" data-p="50"><b>烏龍奶茶</b><em>$50</em></button><button class="drink" data-n="雙色珍珠奶茶" data-p="55"><b>雙色珍珠奶茶</b><em>$55</em></button><button class="drink" data-n="布丁奶茶" data-p="60"><b>布丁奶茶</b><em>$60</em></button><button class="drink" data-n="鮮奶紅／綠／青" data-p="55"><b>鮮奶紅／綠／青</b><em>$55</em></button><button class="drink" data-n="冬瓜鮮奶" data-p="55"><b>冬瓜鮮奶</b><em>$55</em></button><button class="drink" data-n="紅玉拿鐵" data-p="60"><b>紅玉拿鐵</b><em>$60</em></button><button class="drink" data-n="黑糖鮮奶茶" data-p="60"><b>黑糖鮮奶茶</b><em>$60</em></button><button class="drink" data-n="珍珠鮮奶茶" data-p="65"><b>珍珠鮮奶茶</b><em>$65</em></button><button class="drink" data-n="咖啡拿鐵" data-p="65"><b>咖啡拿鐵</b><em>$65</em></button><button class="drink" data-n="可可鮮奶" data-p="65"><b>可可鮮奶</b><em>$65</em></button></div></section><section><h2>特調茶飲</h2><div class=grid><button class="drink" data-n="梅子紅／綠／青" data-p="40"><b>梅子紅／綠／青</b><em>$40</em></button><button class="drink" data-n="蜂蜜紅／綠／青" data-p="45"><b>蜂蜜紅／綠／青</b><em>$45</em></button><button class="drink" data-n="檸檬紅／綠／青" data-p="45"><b>檸檬紅／綠／青</b><em>$45</em></button><button class="drink" data-n="薄荷紅／綠／青" data-p="50"><b>薄荷紅／綠／青</b><em>$50</em></button><button class="drink" data-n="脆梅綠茶" data-p="50"><b>脆梅綠茶</b><em>$50</em></button><button class="drink" data-n="金鑽鳳梨青茶" data-p="50"><b>金鑽鳳梨青茶</b><em>$50</em></button><button class="drink" data-n="鮮榨柳丁綠" data-p="65"><b>鮮榨柳丁綠</b><em>$65</em></button><button class="drink" data-n="鮮果百香綠" data-p="65"><b>鮮果百香綠</b><em>$65</em></button><button class="drink" data-n="香橙百香綠" data-p="70"><b>香橙百香綠</b><em>$70</em></button></div></section><section><h2>現打果汁</h2><div class=grid><button class="drink" data-n="西瓜汁" data-p="40"><b>西瓜汁</b><em>$40</em></button><button class="drink" data-n="西瓜牛奶" data-p="50"><b>西瓜牛奶</b><em>$50</em></button><button class="drink" data-n="香蕉牛奶" data-p="50"><b>香蕉牛奶</b><em>$50</em></button><button class="drink" data-n="蘋果牛奶" data-p="55"><b>蘋果牛奶</b><em>$55</em></button><button class="drink" data-n="綜合果汁" data-p="60"><b>綜合果汁</b><em>$60</em></button><button class="drink" data-n="木瓜牛奶" data-p="65"><b>木瓜牛奶</b><em>$65</em></button><button class="drink" data-n="芒果冰沙（季）" data-p="85"><b>芒果冰沙（季）</b><em>$85</em></button><button class="drink" data-n="芒果牛奶（季）" data-p="90"><b>芒果牛奶（季）</b><em>$90</em></button><button class="drink" data-n="草莓牛奶（季）" data-p="85"><b>草莓牛奶（季）</b><em>$85</em></button></div></section><section><h2>冬瓜・鮮果</h2><div class=grid><button class="drink" data-n="冬瓜茶" data-p="30"><b>冬瓜茶</b><em>$30</em></button><button class="drink" data-n="冬瓜紅／綠／青" data-p="35"><b>冬瓜紅／綠／青</b><em>$35</em></button><button class="drink" data-n="仙冬冰茶" data-p="40"><b>仙冬冰茶</b><em>$40</em></button><button class="drink" data-n="冬瓜檸檬／金桔" data-p="45"><b>冬瓜檸檬／金桔</b><em>$45</em></button><button class="drink" data-n="寒天仙冬冰茶" data-p="55"><b>寒天仙冬冰茶</b><em>$55</em></button><button class="drink" data-n="金桔檸檬" data-p="50"><b>金桔檸檬</b><em>$50</em></button><button class="drink" data-n="檸檬蜜茶" data-p="55"><b>檸檬蜜茶</b><em>$55</em></button><button class="drink" data-n="鮮桔蜜茶" data-p="55"><b>鮮桔蜜茶</b><em>$55</em></button><button class="drink" data-n="檸檬汁" data-p="50"><b>檸檬汁</b><em>$50</em></button><button class="drink" data-n="水果茶" data-p="70"><b>水果茶</b><em>$70</em></button></div></section><section><h2>養身・多多</h2><div class=grid><button class="drink" data-n="蜜茶" data-p="40"><b>蜜茶</b><em>$40</em></button><button class="drink" data-n="仙楂洛神" data-p="45"><b>仙楂洛神</b><em>$45</em></button><button class="drink" data-n="洛神檸檬" data-p="50"><b>洛神檸檬</b><em>$50</em></button><button class="drink" data-n="黑糖薑母茶（季・500ml）" data-p="50"><b>黑糖薑母茶（季・500ml）</b><em>$50</em></button><button class="drink" data-n="桂圓紅棗茶（季・500ml）" data-p="60"><b>桂圓紅棗茶（季・500ml）</b><em>$60</em></button><button class="drink" data-n="綠茶多多" data-p="45"><b>綠茶多多</b><em>$45</em></button><button class="drink" data-n="檸檬多多" data-p="60"><b>檸檬多多</b><em>$60</em></button><button class="drink" data-n="百香多多" data-p="75"><b>百香多多</b><em>$75</em></button></div></section></main>
<section id=cart style="display:none"><div id=lines></div><div id=sum></div><button id=share></button></section><div class=bottom><button id=bar type=button>0杯｜$0　確認訂單</button></div>
<dialog id=dlg><div class=box><button id=close>×</button><h3 id=dn></h3><b id=dp></b><h4>① 甜度</h4><div class=opts id=sugar></div><h4>② 冰塊</h4><div class=opts id=ice></div><h4>③ 加料</h4><div class=opts id=tops></div><h4>④ 杯數</h4><div class=qty><button id=minus>−</button><strong id=q>1</strong><button id=plus>＋</button></div><button id=add>＋ 加入訂單</button></div></dialog>
<dialog id=confirmDlg><div class=box><button id=confirmClose>×</button><h3>確認訂單</h3><div id=confirmLines></div><div id=confirmSum></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><button id=continueBtn type=button style="padding:13px;border:1px solid #ccc;border-radius:12px;background:white;font-weight:bold">繼續加點</button><button id=sendBtn type=button style="padding:13px;border:0;border-radius:12px;background:#426a55;color:white;font-weight:bold">送出／分享</button></div></div></dialog>
<script>
const $=x=>document.querySelector(x),cart=[];let cur,q=1;
function radios(id,a,def){$(id).innerHTML=a.map(x=>`<label><input type=radio name="${id}" value="${x}" ${x==def?'checked':''}><span>${x}</span></label>`).join('')}
function openD(b){cur=b;q=1;$('#q').textContent=1;$('#dn').textContent=b.dataset.n;$('#dp').textContent='$'+b.dataset.p;radios('#sugar',['正常甜','八分糖','五分糖','三分糖','無糖'],'五分糖');radios('#ice',['正常冰','少冰','微冰','去冰'],'少冰');$('#tops').innerHTML=[['黑白珍珠',10],['嫩仙草',10],['椰果',10],['咖啡凍',10],['寒天晶球',15],['統一布丁',15]].map(x=>`<label><input type=checkbox value="${x[0]}" data-p="${x[1]}"><span>${x[0]} +${x[1]}</span></label>`).join('');$('#dlg').showModal()}
document.querySelectorAll('.drink').forEach(b=>b.onclick=()=>openD(b));$('#close').onclick=()=>$('#dlg').close();$('#minus').onclick=()=>{q=Math.max(1,q-1);$('#q').textContent=q};$('#plus').onclick=()=>{q++;$('#q').textContent=q};
$('#add').onclick=()=>{let t=[...$('#tops').querySelectorAll(':checked')],extra=t.reduce((s,x)=>s+ +x.dataset.p,0);cart.push({n:cur.dataset.n,p:+cur.dataset.p+extra,q,s:$('#sugar :checked').value,i:$('#ice :checked').value,t:t.map(x=>x.value)});$('#dlg').close();render()};
function render(){let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0);$('#badge').textContent=cups+'杯 $'+sum;$('#bar').textContent=cups+'杯｜$'+sum+'　確認訂單';$('#lines').innerHTML=cart.length?cart.map((x,i)=>`<div class=line><button onclick="cart.splice(${i},1);render()">刪除</button><b>${x.n} ×${x.q}</b><div class=meta>${x.s}／${x.i}${x.t.length?'／＋'+x.t.join('＋'):''}</div><b>$${x.p*x.q}</b></div>`).join(''):'目前還沒有飲料。';$('#sum').textContent=cart.length?'共 '+cups+' 杯｜合計 $'+sum:''}

function showConfirm(){
 if(!cart.length){alert('請先加入飲料');return}
 let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0);
 $('#confirmLines').innerHTML=cart.map((x,i)=>`<div class=line>
 <button type=button onclick="cart.splice(${i},1);render();showConfirm()">刪除</button>
 <b>${x.n} ×${x.q}</b><div class=meta>${x.s}／${x.i}${x.t.length?'／＋'+x.t.join('＋'):''}</div>
 <div class=qty><button type=button onclick="if(cart[${i}].q>1)cart[${i}].q--;render();showConfirm()">−</button><strong>${x.q}</strong><button type=button onclick="cart[${i}].q++;render();showConfirm()">＋</button></div>
 <b>$${x.p*x.q}</b></div>`).join('');
 $('#confirmSum').innerHTML='<div id=sum style="font-size:20px;font-weight:bold;text-align:right;margin-top:12px">共 '+cups+' 杯｜合計 $'+sum+'</div>';
 if(!$('#confirmDlg').open) $('#confirmDlg').showModal();
}
$('#bar').onclick=showConfirm;
$('#confirmClose').onclick=()=>$('#confirmDlg').close();
$('#continueBtn').onclick=()=>$('#confirmDlg').close();
$('#sendBtn').onclick=()=>{ $('#confirmDlg').close(); $('#share').click(); };

$('#share').onclick=async()=>{if(!cart.length)return alert('請先加入飲料');let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0),txt='【七里香大同店｜追加訂單】\n'+cart.map((x,i)=>(i+1)+'. '+x.n+' ×'+x.q+'\n　'+x.s+'／'+x.i+(x.t.length?'／＋'+x.t.join('＋'):'')+'　$'+x.p*x.q).join('\n')+'\n\n共 '+cups+' 杯｜合計 $'+sum;if(navigator.share)try{await navigator.share({text:txt})}catch(e){}else prompt('請複製訂單',txt)};
</script></body></html>
