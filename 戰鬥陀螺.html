<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>杯王陀螺試玩</title><style>*{box-sizing:border-box}body{margin:0;background:#101217;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;overflow:hidden;touch-action:none}.wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px}.hud{width:min(94vw,520px);display:flex;justify-content:space-between;align-items:center;font-weight:800}.arena{position:relative;width:min(94vw,520px);aspect-ratio:1;border-radius:50%;margin-top:10px;background:radial-gradient(circle,#f0f0e8 0 44%,#c7c8c0 45% 61%,#363a42 62% 65%,#171a20 66%);box-shadow:0 0 0 4px #555,0 12px 40px #0008;overflow:hidden}.ring{position:absolute;inset:11%;border:2px dashed #777;border-radius:50%}.top{position:absolute;width:62px;height:62px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:inset 0 0 0 8px #ffffff30,0 5px 12px #0008}.top:after{content:"";position:absolute;inset:18px;border-radius:50%;background:#111;box-shadow:0 0 0 5px #fff6}.p{background:conic-gradient(#31d47d,#0d6539,#9affc4,#31d47d)}.e{background:conic-gradient(#9a623a,#4d2613,#f3b77d,#9a623a)}.spin{animation:spin .28s linear infinite}@keyframes spin{to{rotate:360deg}}.msg{height:38px;margin-top:10px;font-size:24px;font-weight:900}.controls{width:min(94vw,520px);display:flex;gap:12px;margin-top:8px}.btn{flex:1;border:0;border-radius:16px;padding:16px 8px;font-size:18px;font-weight:900;background:#2bd178;color:#062714;box-shadow:0 5px 0 #157a44}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #157a44}.dash{background:#ffd34d;color:#382b00;box-shadow:0 5px 0 #a98000}.hint{opacity:.75;font-size:13px;margin-top:10px;text-align:center;line-height:1.4}.shake{animation:shake .18s linear 2}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}} </style></head><body><div class="wrap"><div class="hud"><span>🟢 茉香綠 <b id="php">100</b></span><span>黑糖珍珠 <b id="ehp">100</b> 🟤</span></div><div id="arena" class="arena"><div class="ring"></div><div id="p" class="top p spin"></div><div id="e" class="top e spin"></div></div><div id="msg" class="msg">準備！</div><div class="controls"><button id="launch" class="btn">⚡ 發射陀螺</button><button id="dash" class="btn dash">💥 衝撞</button></div><div class="hint">發射後，手指按住競技場拖曳茉香綠。<br>靠近黑糖珍珠時按「衝撞」，把它撞出場！</div></div><script>
const A=document.querySelector('#arena'),P=document.querySelector('#p'),E=document.querySelector('#e'),msg=document.querySelector('#msg');let running=false,px=.32,py=.5,ex=.68,ey=.5,pvx=0,pvy=0,evx=0,evy=0,boost=0,last=0;const php=document.querySelector('#php'),ehp=document.querySelector('#ehp');let ph=100,eh=100;
function pos(el,x,y){el.style.left=x*100+'%';el.style.top=y*100+'%'}pos(P,px,py);pos(E,ex,ey);
function reset(){running=false;px=.32;py=.5;ex=.68;ey=.5;pvx=pvy=evx=evy=0;ph=eh=100;php.textContent=ph;ehp.textContent=eh;pos(P,px,py);pos(E,ex,ey);msg.textContent='準備！';document.querySelector('#launch').textContent='⚡ 發射陀螺'}
document.querySelector('#launch').onclick=()=>{if(running){reset();return}running=true;msg.textContent='戰鬥！';document.querySelector('#launch').textContent='↻ 重新開始';last=performance.now();requestAnimationFrame(loop)};
document.querySelector('#dash').onclick=()=>{if(running)boost=1};
function target(ev){let r=A.getBoundingClientRect(),t=ev.touches?ev.touches[0]:ev;let tx=(t.clientX-r.left)/r.width,ty=(t.clientY-r.top)/r.height;let dx=tx-px,dy=ty-py,d=Math.hypot(dx,dy)||1;pvx+=dx/d*.006*(boost?2.6:1);pvy+=dy/d*.006*(boost?2.6:1);boost=0}A.addEventListener('touchmove',e=>{e.preventDefault();target(e)},{passive:false});A.addEventListener('pointermove',e=>{if(e.buttons)target(e)});
function out(x,y){return Math.hypot(x-.5,y-.5)>.42}
function loop(t){if(!running)return;let dt=Math.min(2,(t-last)/16.67);last=t;let dx=px-ex,dy=py-ey,d=Math.hypot(dx,dy)||.001;evx+=((px-ex)/d)*.0008*dt+(.5-ex)*.00012;evy+=((py-ey)/d)*.0008*dt+(.5-ey)*.00012;if(d<.125){let nx=dx/d,ny=dy/d,impact=Math.hypot(pvx-evx,pvy-evy);pvx+=nx*(.008+impact*.5);pvy+=ny*(.008+impact*.5);evx-=nx*(.011+impact*.8);evy-=ny*(.011+impact*.8);let dmg=Math.min(12,Math.round(impact*500));eh=Math.max(0,eh-dmg);ph=Math.max(0,ph-Math.round(dmg*.45));ehp.textContent=eh;php.textContent=ph;A.classList.remove('shake');void A.offsetWidth;A.classList.add('shake');if(navigator.vibrate)navigator.vibrate(20)}pvx*=.985;pvy*=.985;evx*=.987;evy*=.987;px+=pvx*dt;py+=pvy*dt;ex+=evx*dt;ey+=evy*dt;pos(P,px,py);pos(E,ex,ey);if(out(ex,ey)||eh<=0){running=false;msg.textContent='🏆 茉香綠勝利！';return}if(out(px,py)||ph<=0){running=false;msg.textContent='💥 黑糖珍珠勝利！';return}requestAnimationFrame(loop)}
</script></body></html>
