<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>七里香庫存 V7</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5f1;font-family:-apple-system,"Noto Sans TC",sans-serif;color:#20231f}.app{max-width:520px;margin:auto;padding:18px 15px 80px}h1{margin:3px 0}.muted{font-size:12px;color:#777}.hero{background:#222b25;color:#fff;padding:17px;border-radius:20px;margin:15px 0}.hero b{font-size:19px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.a{border:0;background:#fff;border-radius:20px;padding:18px 13px;text-align:left}.a.full{grid-column:1/-1;background:#fff4cd}.ico{font-size:30px}.a b{display:block;font-size:17px;margin:6px 0}.card{background:#fff;padding:14px;border-radius:17px;margin:9px 0}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:25px 25px 0 0;padding:20px}.preview{min-height:190px;border:2px dashed #ccc;border-radius:17px;margin:14px 0;display:flex;align-items:center;justify-content:center;overflow:hidden}.preview img{width:100%;max-height:300px;object-fit:contain}.btn{width:100%;padding:14px;border:0;border-radius:13px;background:#222;color:#fff;font-weight:800;margin-top:8px}.light{background:#e9ebe7;color:#222}.result{display:none}.note{background:#f3f3ef;border-radius:12px;padding:10px;font-size:12px;margin:10px 0}.line{display:grid;grid-template-columns:1.6fr .55fr .55fr;gap:6px;margin:7px 0}.line input{width:100%;padding:9px;border:1px solid #ddd;border-radius:9px}.confidence{padding:9px 3px;text-align:center;border-radius:9px;background:#e1f3e5;font-size:11px}.warn{background:#fff0c4}</style></head><body>
<div class="app"><div class="muted">七里香大同店</div><h1>今天要做什麼？</h1><div class="hero"><b>🚨 2 項需要注意</b><br><span class="muted" style="color:#ccd2ce">鮮奶建議補貨・1512 珍珠接近安全線</span></div>
<div class="grid"><button class="a full" onclick="openM()"><div class="ico">📷</div><b>拍出貨單，自動入庫</b><span class="muted">拍照 → 辨識 → 確認 → 入庫</span></button><button class="a"><div class="ico">📦</div><b>快速盤點</b><span class="muted">看到多少就按多少</span></button><button class="a"><div class="ico">🚨</div><b>補貨建議</b><span class="muted">今天該處理什麼</span></button></div>
<h3>最近入庫</h3><div id="history"></div></div>
<div class="modal" id="modal"><div class="sheet"><h2>📷 拍出貨單</h2><div class="muted">整張單據拍清楚，尤其日期、品名、數量。</div><div class="preview" id="preview">🧾 尚未選照片</div>
<input hidden id="file" type="file" accept="image/*" capture="environment" onchange="photo(event)"><button class="btn" onclick="file.click()">開啟相機 / 選照片</button><button class="btn light" id="recognize" style="display:none" onclick="recognize()">辨識這張單據</button>
<div class="result" id="result"><h3>辨識結果</h3><div class="note">測試版目前先驗證操作流程，尚未連接真正的雲端影像辨識；因此不會假裝照片已被讀取。下列為示範辨識結果，可修改後入庫。</div>
<label>出貨日期</label><input id="date" value="2026/09/18" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:10px"><div id="lines"></div><button class="btn" onclick="commit()">確認資料，正式入庫</button></div><button class="btn light" onclick="closeM()">關閉</button></div></div>
<script>
let records=JSON.parse(localStorage.getItem("qlx-v7")||"[]");
function openM(){modal.style.display="flex"}function closeM(){modal.style.display="none"}
function photo(e){let f=e.target.files[0];if(!f)return;preview.innerHTML='<img src="'+URL.createObjectURL(f)+'">';recognize.style.display="block";result.style.display="none"}
function recognize(){let a=[["青茶 1斤4包",10,"斤",""],["綠茶 1斤4包",5,"斤",""],["台糖黑糖3kg",1,"包",""],["700紙杯",2,"箱","warn"]];lines.innerHTML=a.map((x,i)=>'<div class="line"><input id="n'+i+'" value="'+x[0]+'"><input id="q'+i+'" type="number" value="'+x[1]+'"><div class="confidence '+x[3]+'">'+(x[3]?"確認":"高")+'</div><input id="u'+i+'" value="'+x[2]+'" hidden></div>').join("");result.style.display="block";result.scrollIntoView({behavior:"smooth"})}
function commit(){let a=[];for(let i=0;i<4;i++)a.push({name:document.getElementById("n"+i).value,qty:+document.getElementById("q"+i).value,unit:document.getElementById("u"+i).value});records.push({date:date.value,items:a});localStorage.setItem("qlx-v7",JSON.stringify(records));render();closeM()}
function render(){history.innerHTML=records.length?records.slice().reverse().map(r=>'<div class="card"><b>'+r.date+'</b><div class="muted">'+r.items.map(x=>x.name+" "+x.qty+x.unit).join("・")+'</div></div>').join(""):'<div class="card muted">尚無紀錄，拍第一張出貨單開始。</div>'}render();
</script></body></html>
