<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>杯王陀螺 V5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial,sans-serif}
#app{height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 38%,#303b46 0,#0a0e13 58%,#030405 100%)}
header{width:min(96vw,560px);padding:10px 5px 4px;display:flex;justify-content:space-between;font-weight:900}.tag{font-size:10px;background:#d9ff32;color:#111;padding:3px 6px;border-radius:5px}
#hud{width:min(96vw,560px);display:flex;gap:7px}.card{flex:1;background:#111923;border:1px solid #3b4753;border-radius:11px;padding:7px 8px;font-size:11px;font-weight:900}.bar{height:7px;background:#27313b;border-radius:9px;margin-top:5px;overflow:hidden}.fill{height:100%;width:100%;background:#caff38}#eFill{background:#ff7138}
#arena{position:relative;width:min(96vw,560px);aspect-ratio:1;max-height:67svh}canvas{display:block;width:100%;height:100%}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;font-size:39px;font-weight:1000;font-style:italic;text-shadow:0 4px #000,0 0 20px #fff;opacity:0}.pop{animation:pop .65s ease-out}@keyframes pop{0%{opacity:0;transform:scale(.4)}22%{opacity:1;transform:scale(1.15)}70%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
#controls{width:min(96vw,560px);padding:3px}.big{width:100%;border:0;border-radius:14px;padding:15px;background:#d9ff32;color:#0b0e11;font-size:19px;font-weight:1000;box-shadow:0 5px 0 #71890b;touch-action:manipulation}
#launchPanel{display:none;background:#111923;border:1px solid #3b4753;border-radius:14px;padding:10px;text-align:center}.powerText{font-size:24px;font-weight:1000;color:#d9ff32;margin:3px}
#launchBtn{width:100%;height:62px;border:0;border-radius:12px;background:#fff;color:#111;font-size:18px;font-weight:1000;touch-action:none;user-select:none;-webkit-user-select:none}
.note{font-size:10px;color:#8d98a3;margin-top:6px}
</style></head>
<body><div id="app">
<header><div>杯王陀螺 <span class="tag">V5 IMPACT</span></div><div>⏱ <span id="clock">15.0</span></div></header>
<div id="hud"><div class="card">🍵 茉香疾風 <span id="pPct">100%</span><div class="bar"><div class="fill" id="pFill"></div></div></div><div class="card">黑糖重擊 🧋 <span id="ePct">100%</span><div class="bar"><div class="fill" id="eFill"></div></div></div></div>
<div id="arena"><canvas id="game"></canvas><div id="message"></div></div>
<div id="controls">
<button id="startBtn" class="big" type="button" onclick="Game.prepare()">⚡ 準備戰鬥</button>
<div id="launchPanel"><div>按住發射器蓄力，放手就發射</div><div class="powerText">POWER <span id="power">70</span>%</div>
<button id="launchBtn" type="button">按住蓄力 → 放手發射</button><div class="note">不用拖曳。按住約 0.5 秒即可接近滿力。</div></div>
</div></div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var canvas=$("game"),ctx=canvas.getContext("2d"),msg=$("message");
var startBtn=$("startBtn"),launchPanel=$("launchPanel"),launchBtn=$("launchBtn");
var powerText=$("power"),clockEl=$("clock"),pFill=$("pFill"),eFill=$("eFill"),pPct=$("pPct"),ePct=$("ePct");
var W=0,H=0,cx=0,cy=0,R=0,P=null,E=null,state="idle",last=0,timeLeft=15,particles=[],shake=0,slow=0,holdStart=0,holdTimer=0,power=70,raf=0;

function resize(){var r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;cx=W/2;cy=H/2;R=W*.36;}
function makeBey(x,y,type){return{x:x,y:y,vx:0,vy:0,r:W*.052,spin:100,a:0,type:type,hit:0,rail:0};}
function reset(){P=makeBey(cx-R*.48,cy,"p");E=makeBey(cx+R*.48,cy,"e");timeLeft=15;particles=[];shake=0;slow=0;updateHud();}
function updateHud(){var ps=Math.max(0,P.spin),es=Math.max(0,E.spin);pFill.style.width=ps+"%";eFill.style.width=es+"%";pPct.textContent=Math.floor(ps)+"%";ePct.textContent=Math.floor(es)+"%";clockEl.textContent=Math.max(0,timeLeft).toFixed(1);}
function announce(s){msg.textContent=s;msg.className="";void msg.offsetWidth;msg.className="pop";}
function stadium(){ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);var q=ctx.createRadialGradient(cx,cy,5,cx,cy,R*1.35);q.addColorStop(0,"#3d4b57");q.addColorStop(.56,"#18212a");q.addColorStop(.72,"#080b0f");q.addColorStop(.9,"#28333d");q.addColorStop(1,"#040506");ctx.fillStyle=q;ctx.beginPath();ctx.ellipse(cx,cy,R*1.23,R*1.08,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d9ff32";ctx.lineWidth=8;ctx.setLineDash([18,6]);ctx.beginPath();ctx.ellipse(cx,cy,R*.98,R*.86,0,.15,5.35);ctx.stroke();ctx.setLineDash([]);for(var i=0;i<2;i++){var a=i===0?.62:2.52;ctx.fillStyle="#010203";ctx.beginPath();ctx.arc(cx+Math.cos(a)*R*1.02,cy+Math.sin(a)*R*.9,R*.2,0,Math.PI*2);ctx.fill();}ctx.restore();}
function drawBey(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.a);var r=o.r,gr=ctx.createRadialGradient(-r*.3,-r*.3,1,0,0,r);if(o.type==="p"){gr.addColorStop(0,"#f1ffd8");gr.addColorStop(.25,"#7ee23b");gr.addColorStop(.52,"#163b29");gr.addColorStop(.76,"#d8dde0");gr.addColorStop(1,"#505961");}else{gr.addColorStop(0,"#fff0c3");gr.addColorStop(.25,"#e4822e");gr.addColorStop(.52,"#512117");gr.addColorStop(.76,"#d8dde0");gr.addColorStop(1,"#555d64");}ctx.fillStyle=gr;ctx.strokeStyle="#f5f6f7";ctx.lineWidth=2.5;ctx.beginPath();for(var i=0;i<16;i++){var a=i*Math.PI/8,rr=i%2?r*.7:r;if(i===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=o.type==="p"?"#b9ff39":"#ff8030";ctx.beginPath();ctx.arc(0,0,r*.33,0,Math.PI*2);ctx.fill();ctx.restore();}
function sparks(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*7;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:15+Math.random()*18});}}
function moveBey(o,dt){o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=(o.type==="p"?1:-1)*(.34+.2*o.spin/100)*dt;o.vx*=Math.pow(.994,dt);o.vy*=Math.pow(.994,dt);o.spin-=(.035+Math.hypot(o.vx,o.vy)*.002)*dt;o.hit=Math.max(0,o.hit-dt);var dx=o.x-cx,dy=o.y-cy,ed=Math.hypot(dx/(R*1.02),dy/(R*.9));
if(ed>.76&&ed<1.0&&o.spin>20){o.rail+=dt;if(o.rail>5){var d=Math.hypot(dx,dy)||1,tx=-dy/d,ty=dx/d,sg=o.type==="p"?1:-1;o.vx+=tx*.42*sg*dt;o.vy+=ty*.42*sg*dt;o.spin-=.025*dt;}}else{o.rail=0;}
if(ed>1&&ed<1.13){var d2=Math.hypot(dx,dy)||1,nx=dx/d2,ny=dy/d2,dot=o.vx*nx+o.vy*ny;if(dot>0){o.vx-=1.8*dot*nx;o.vy-=1.8*dot*ny;o.spin-=dot*.65;}}
if(ed>1.18){finish(o===E?"⚡ XTREME FINISH!":"RING OUT!",o===E);}}
function pacing(){var dx=E.x-P.x,dy=E.y-P.y,d=Math.hypot(dx,dy)||1;if(timeLeft<13&&Math.random()<.04){var f=timeLeft<7?.36:.22;P.vx+=dx/d*f;P.vy+=dy/d*f;E.vx-=dx/d*f*.85;E.vy-=dy/d*f*.85;}if(timeLeft<7){P.spin-=.07;E.spin-=.075;}}
function collide(){var dx=E.x-P.x,dy=E.y-P.y,d=Math.hypot(dx,dy)||1;if(d<P.r+E.r&&P.hit<=0&&E.hit<=0){var nx=dx/d,ny=dy/d,rel=Math.abs((E.vx-P.vx)*nx+(E.vy-P.vy)*ny),imp=Math.max(4,rel);P.vx-=nx*imp*.9;P.vy-=ny*imp*.9;E.vx+=nx*imp*.9;E.vy+=ny*imp*.9;P.spin-=imp*.8;E.spin-=imp*1.0;P.hit=E.hit=5;sparks((P.x+E.x)/2,(P.y+E.y)/2,imp>7?38:22);shake=Math.min(17,imp*1.8);if(imp>7){slow=8;announce("💥 SMASH!");}else announce("CLASH!");try{if(navigator.vibrate)navigator.vibrate(imp>7?[45,20,65]:25);}catch(e){}if(imp>9&&E.spin<55&&Math.random()<.25)finish("💥 BURST FINISH!",true);}}
function finish(text,playerWon){if(state!=="battle")return;state="done";announce(text);setTimeout(function(){startBtn.style.display="block";startBtn.textContent="🔥 再戰一場";},700);}
function frame(ts){var raw=Math.min(2,(ts-last)/16.67||1);last=ts;var dt=slow>0?raw*.3:raw;if(slow>0)slow--;stadium();if(state==="battle"){timeLeft-=raw/60;moveBey(P,dt);moveBey(E,dt);pacing();collide();if(P.spin<=0)finish("SPIN FINISH! 黑糖勝",false);if(E.spin<=0)finish("SPIN FINISH! 茉香勝",true);if(timeLeft<=0)finish(P.spin>=E.spin?"LAST SPIN! 茉香勝":"LAST SPIN! 黑糖勝",P.spin>=E.spin);updateHud();}drawBey(P);drawBey(E);for(var i=particles.length-1;i>=0;i--){var q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.92;q.vy*=.92;q.l--;ctx.fillStyle=q.l%2?"#fff":"#d9ff32";ctx.fillRect(q.x,q.y,3.5,3.5);if(q.l<=0)particles.splice(i,1);}shake*=.78;raf=requestAnimationFrame(frame);}
function prepare(){reset();state="charge";startBtn.style.display="none";launchPanel.style.display="block";power=70;powerText.textContent="70";announce("READY");}
function chargeStart(e){if(state!=="charge")return;if(e&&e.preventDefault)e.preventDefault();holdStart=performance.now();power=70;powerText.textContent="70";clearInterval(holdTimer);holdTimer=setInterval(function(){var ms=performance.now()-holdStart;power=Math.min(100,70+ms/18);powerText.textContent=Math.floor(power);},30);}
function chargeEnd(e){if(state!=="charge"||!holdStart)return;if(e&&e.preventDefault)e.preventDefault();clearInterval(holdTimer);holdTimer=0;holdStart=0;launchPanel.style.display="none";state="battle";var p=power/100,a=-.38+(Math.random()-.5)*.18,sp=7.1+3.3*p;P.spin=90+10*p;E.spin=94+Math.random()*6;P.vx=Math.cos(a)*sp;P.vy=Math.sin(a)*sp;var ea=Math.PI+.3+(Math.random()-.5)*.28,es=7.8+Math.random()*2;E.vx=Math.cos(ea)*es;E.vy=Math.sin(ea)*es;announce(power>94?"⚡ PERFECT SHOOT!":"GO SHOOT!");try{if(navigator.vibrate)navigator.vibrate([25,15,45]);}catch(ex){}}
window.Game={prepare:prepare};
if(window.PointerEvent){launchBtn.addEventListener("pointerdown",chargeStart,{passive:false});launchBtn.addEventListener("pointerup",chargeEnd,{passive:false});launchBtn.addEventListener("pointercancel",chargeEnd,{passive:false});}else{launchBtn.addEventListener("touchstart",chargeStart,{passive:false});launchBtn.addEventListener("touchend",chargeEnd,{passive:false});launchBtn.addEventListener("mousedown",chargeStart,false);launchBtn.addEventListener("mouseup",chargeEnd,false);}
window.addEventListener("resize",resize);resize();reset();raf=requestAnimationFrame(frame);
})();
</script></body></html>
