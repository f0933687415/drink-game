<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>杯王陀螺 V4</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#05070a;color:white;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;touch-action:none}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 38%,#313b46,#0b0f14 55%,#030405)}
header{width:min(96vw,560px);padding:9px 5px 3px;display:flex;justify-content:space-between;font-weight:1000}.tag{background:#d9ff32;color:#111;padding:2px 6px;border-radius:5px;font-size:11px}
.hud{width:min(96vw,560px);display:flex;gap:6px}.card{flex:1;background:#111923d9;border:1px solid #3c4855;border-radius:11px;padding:6px 8px;font-size:11px;font-weight:900}.bar{height:7px;background:#27313b;border-radius:9px;margin-top:4px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#9df530,#e9ff89)}#ef{background:linear-gradient(90deg,#ffc02f,#ff4939)}
.arena{position:relative;width:min(96vw,560px);aspect-ratio:1;max-height:69svh}canvas{width:100%;height:100%;display:block}.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;font-size:39px;font-weight:1000;font-style:italic;text-shadow:0 4px #000,0 0 20px #fff;opacity:0}.pop{animation:pop .58s ease-out}@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.18)}70%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
.bottom{width:min(96vw,560px);padding:2px}.start{width:100%;border:0;border-radius:14px;padding:14px;background:#d9ff32;color:#101317;font-size:18px;font-weight:1000;box-shadow:0 5px #718a09}
.launcher{display:none;background:#111923;border:1px solid #3b4754;border-radius:14px;padding:9px}.instruction{text-align:center;font-size:12px;font-weight:800}.power{text-align:center;font-size:24px;font-weight:1000;color:#d9ff32;margin:3px}.slot{height:58px;position:relative;background:#242d36;border-radius:12px;overflow:hidden}.rope{position:absolute;left:14%;right:14%;top:27px;height:5px;background:#707b84;border-radius:5px}.handle{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:72px;height:42px;border-radius:10px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-weight:1000;box-shadow:0 3px 10px #0008;touch-action:none}.hint{text-align:center;font-size:10px;color:#89939d;margin-top:5px}
</style></head><body><div class="app"><header><div>杯王陀螺 <span class="tag">V4 TURBO</span></div><div>⏱ <span id="time">20.0</span></div></header>
<div class="hud"><div class="card">🍵 茉香疾風 <span id="ps">100%</span><div class="bar"><div class="fill" id="pf"></div></div></div><div class="card">黑糖重擊 🧋 <span id="es">100%</span><div class="bar"><div class="fill" id="ef"></div></div></div></div>
<div class="arena"><canvas id="c"></canvas><div class="msg" id="msg"></div></div>
<div class="bottom"><button class="start" id="start">⚡ 準備發射</button><div class="launcher" id="launcher"><div class="instruction">按住白色把手 → 往左或右拉 → 放手！</div><div class="power">POWER <span id="power">70</span>%</div><div class="slot" id="slot"><div class="rope"></div><div class="handle" id="handle">PULL</div></div><div class="hint">只要拉一小段就能滿力；直接點放也會正常發射</div></div></div></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d'),msg=document.getElementById('msg'),start=document.getElementById('start'),launcher=document.getElementById('launcher'),handle=document.getElementById('handle'),powerEl=document.getElementById('power');
let W,H,cx,cy,R,P,E,state='idle',last=0,left=20,parts=[],shake=0,drag=null,power=.7,slow=0,burstParts=[];
function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;g.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;cx=W/2;cy=H/2;R=W*.36}addEventListener('resize',resize);resize();
function top(x,y,type){return{x,y,vx:0,vy:0,r:W*.052,spin:100,a:0,type,hit:0,wob:0,rail:0}}
function reset(){P=top(cx-R*.48,cy,'p');E=top(cx+R*.48,cy,'e');parts=[];burstParts=[];left=20;hud()}
function hud(){pf.style.width=Math.max(0,P.spin)+'%';ef.style.width=Math.max(0,E.spin)+'%';ps.textContent=Math.max(0,P.spin|0)+'%';es.textContent=Math.max(0,E.spin|0)+'%';time.textContent=Math.max(0,left).toFixed(1)}
function say(s){msg.textContent=s;msg.className='msg';void msg.offsetWidth;msg.className='msg pop'}
function stadium(){g.save();if(shake)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let q=g.createRadialGradient(cx,cy,8,cx,cy,R*1.35);q.addColorStop(0,'#394651');q.addColorStop(.56,'#182029');q.addColorStop(.72,'#090c10');q.addColorStop(.9,'#26313a');q.addColorStop(1,'#050608');g.fillStyle=q;g.beginPath();g.ellipse(cx,cy,R*1.23,R*1.08,0,0,6.283);g.fill();g.strokeStyle='#d9ff32';g.lineWidth=8;g.setLineDash([18,6]);g.beginPath();g.ellipse(cx,cy,R*.98,R*.86,0,.15,5.35);g.stroke();g.setLineDash([]);for(let a of [.62,2.52]){g.fillStyle='#020304';g.beginPath();g.arc(cx+Math.cos(a)*R*1.02,cy+Math.sin(a)*R*.9,R*.2,0,6.283);g.fill()}g.restore()}
function draw(o){g.save();g.translate(o.x,o.y);g.rotate(o.a);let r=o.r,gr=g.createRadialGradient(-r*.3,-r*.3,1,0,0,r);if(o.type==='p'){gr.addColorStop(0,'#efffd0');gr.addColorStop(.27,'#80e33c');gr.addColorStop(.53,'#173b29');gr.addColorStop(.78,'#d8dde0');gr.addColorStop(1,'#505961')}else{gr.addColorStop(0,'#fff0c0');gr.addColorStop(.27,'#e3822e');gr.addColorStop(.53,'#502117');gr.addColorStop(.78,'#d8dde0');gr.addColorStop(1,'#555d64')}g.fillStyle=gr;g.strokeStyle='#f4f5f6';g.lineWidth=2.5;g.beginPath();for(let i=0;i<16;i++){let a=i*Math.PI/8,rr=i%2?r*.7:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.stroke();g.fillStyle=o.type==='p'?'#b8ff39':'#ff7e30';g.beginPath();g.arc(0,0,r*.33,0,6.283);g.fill();g.restore()}
function spark(x,y,n){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=2+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:16+Math.random()*15})}}
function move(o,dt){o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=(o.type==='p'?1:-1)*(.3+.2*o.spin/100)*dt;o.vx*=Math.pow(.995,dt);o.vy*=Math.pow(.995,dt);o.spin-=(.025+Math.hypot(o.vx,o.vy)*.0018)*dt;o.hit=Math.max(0,o.hit-dt);let dx=o.x-cx,dy=o.y-cy,ed=Math.hypot(dx/(R*1.02),dy/(R*.9));
if(ed>.76&&ed<1.0&&o.spin>25){o.rail+=dt;if(o.rail>7){let tx=-dy/(Math.hypot(dx,dy)||1),ty=dx/(Math.hypot(dx,dy)||1),sg=o.type==='p'?1:-1;o.vx+=tx*.34*sg*dt;o.vy+=ty*.34*sg*dt}}else o.rail=0;
if(ed>1&&ed<1.13){let d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d,dot=o.vx*nx+o.vy*ny;if(dot>0){o.vx-=1.75*dot*nx;o.vy-=1.75*dot*ny;o.spin-=dot*.55}}
if(ed>1.18)finish(o===E?'XTREME FINISH!':'RING OUT!',o===E)}
function collide(){let dx=E.x-P.x,dy=E.y-P.y,d=Math.hypot(dx,dy)||1;if(d<P.r+E.r&&P.hit<=0){let nx=dx/d,ny=dy/d,rel=Math.abs((E.vx-P.vx)*nx+(E.vy-P.vy)*ny),imp=Math.max(3.5,rel);P.vx-=nx*imp*.82;P.vy-=ny*imp*.82;E.vx+=nx*imp*.82;E.vy+=ny*imp*.82;P.spin-=imp*.75;E.spin-=imp*.95;P.hit=E.hit=5;spark((P.x+E.x)/2,(P.y+E.y)/2,imp>7?34:19);shake=Math.min(16,imp*1.7);slow=imp>7?9:0;say(imp>7?'💥 SMASH!':'CLASH!');if(navigator.vibrate)navigator.vibrate(imp>7?[45,20,65]:30);if(imp>9&&E.spin<58&&Math.random()<.22)finish('BURST FINISH!',true)}}
function chase(){// hidden pacing director: preserves autonomous look but prevents dead air
let dx=E.x-P.x,dy=E.y-P.y,d=Math.hypot(dx,dy)||1;if(left<17&&Math.random()<.025){let force=left<10?.26:.16;P.vx+=dx/d*force;P.vy+=dy/d*force;E.vx-=dx/d*force*.75;E.vy-=dy/d*force*.75}
if(left<10){P.spin-=.035;E.spin-=.04}}
function finish(s,win){if(state!=='battle')return;state='done';say(s);if(s.includes('BURST')){for(let i=0;i<5;i++)burstParts.push({x:E.x,y:E.y,a:i*1.25,vx:Math.cos(i*1.25)*5,vy:Math.sin(i*1.25)*5,l:45})}setTimeout(()=>{start.style.display='block';start.textContent='🔥 再戰一場'},650)}
function loop(ts){requestAnimationFrame(loop);let raw=Math.min(2,(ts-last)/16.67||1);last=ts,dt=slow?raw*.28:raw;if(slow)slow--;stadium();if(state==='battle'){left-=raw/60;move(P,dt);move(E,dt);chase();collide();if(P.spin<=0)finish('SPIN FINISH!',false);if(E.spin<=0)finish('SPIN FINISH!',true);if(left<=0)finish(P.spin>E.spin?'LAST SPIN! 茉香勝':'LAST SPIN! 黑糖勝',P.spin>E.spin);hud()}draw(P);draw(E);for(let q of parts){q.x+=q.vx;q.y+=q.vy;q.vx*=.92;q.vy*=.92;q.l--;g.fillStyle=q.l%2?'#fff':'#d9ff32';g.fillRect(q.x,q.y,3.5,3.5)}parts=parts.filter(q=>q.l>0);for(let q of burstParts){q.x+=q.vx;q.y+=q.vy;q.a+=.25;q.l--;g.save();g.translate(q.x,q.y);g.rotate(q.a);g.fillStyle='#ff8a32';g.fillRect(-10,-5,20,10);g.restore()}burstParts=burstParts.filter(q=>q.l>0);shake*=.78}
reset();requestAnimationFrame(loop);
start.onclick=()=>{reset();state='launch';start.style.display='none';launcher.style.display='block';power=.7;powerEl.textContent='70';handle.style.left='50%';say('READY')};
function down(e){if(state!=='launch')return;e.preventDefault();let t=e.touches?e.touches[0]:e;drag={x:t.clientX};handle.setPointerCapture?.(e.pointerId)}
function moveDrag(e){if(!drag)return;e.preventDefault();let t=e.touches?e.touches[0]:e,dx=t.clientX-drag.x,max=115,cl=Math.max(-max,Math.min(max,dx));handle.style.left=`calc(50% + ${cl}px)`;power=Math.min(1,.7+Math.abs(cl)/max*.3);powerEl.textContent=Math.round(power*100)}
function up(e){if(!drag||state!=='launch')return;e.preventDefault();drag=null;launcher.style.display='none';state='battle';let a=-.38+(Math.random()-.5)*.22,sp=6.1+3.5*power;P.spin=88+12*power;E.spin=92+Math.random()*8;P.vx=Math.cos(a)*sp;P.vy=Math.sin(a)*sp;let ea=Math.PI+.3+(Math.random()-.5)*.3,es=7+Math.random()*2;E.vx=Math.cos(ea)*es;E.vy=Math.sin(ea)*es;say(power>.94?'⚡ PERFECT SHOOT!':'GO SHOOT!');if(navigator.vibrate)navigator.vibrate([25,15,45])}
handle.addEventListener('pointerdown',down);addEventListener('pointermove',moveDrag,{passive:false});addEventListener('pointerup',up,{passive:false});handle.addEventListener('touchstart',down,{passive:false});addEventListener('touchmove',moveDrag,{passive:false});addEventListener('touchend',up,{passive:false});
</script></body></html>
