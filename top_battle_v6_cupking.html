<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070a0e"><title>杯王陀螺 V6｜七里香挑戰</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}#app{height:100vh;height:100svh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(circle at 50% 35%,#34404b 0,#0a0e13 58%,#030405 100%)}
header{width:min(96vw,580px);padding:8px 4px 3px;display:flex;justify-content:space-between;align-items:center;font-weight:950}.brand{font-size:16px}.tag{font-size:9px;background:#d9ff32;color:#111;padding:3px 6px;border-radius:5px}.king{font-size:10px;color:#c9d1d9;text-align:right}
#hud{width:min(96vw,580px);display:flex;gap:6px}.card{flex:1;background:#111923;border:1px solid #3b4753;border-radius:10px;padding:6px 7px;font-size:10px;font-weight:900}.bar{height:7px;background:#27313b;border-radius:9px;margin-top:4px;overflow:hidden}.fill{height:100%;width:100%;background:#caff38}#eFill{background:#ff7138}
#arena{position:relative;width:min(96vw,580px);aspect-ratio:1;max-height:64svh}canvas{display:block;width:100%;height:100%}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;font-size:36px;font-weight:1000;font-style:italic;text-shadow:0 4px #000,0 0 18px #fff;opacity:0;padding:20px}.pop{animation:pop .7s ease-out}@keyframes pop{0%{opacity:0;transform:scale(.4)}18%{opacity:1;transform:scale(1.14)}72%{opacity:1}100%{opacity:0;transform:scale(1.45)}}
#controls{width:min(96vw,580px);padding:2px 3px 8px}.big,.action{width:100%;border:0;border-radius:13px;padding:13px;background:#d9ff32;color:#0b0e11;font-size:17px;font-weight:1000;box-shadow:0 4px 0 #71890b;touch-action:manipulation}
#setup,#launchPanel,#result{display:none;background:#111923;border:1px solid #3b4753;border-radius:13px;padding:9px}.row{display:flex;gap:6px}.name{width:100%;border:1px solid #475462;background:#090d12;color:#fff;border-radius:10px;padding:10px;font-size:15px;outline:none}
.drinks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.drink{border:1px solid #46525e;background:#18212a;color:#fff;border-radius:10px;padding:8px 5px;font-size:11px;font-weight:900}.drink.sel{border:2px solid #d9ff32;background:#26331c}.drink small{display:block;color:#9ca8b3;font-size:9px;margin-top:2px}
#launchPanel{text-align:center}.powerText{font-size:22px;font-weight:1000;color:#d9ff32;margin:2px}#launchBtn{width:100%;height:57px;border:0;border-radius:11px;background:#fff;color:#111;font-size:17px;font-weight:1000;touch-action:none;user-select:none;-webkit-user-select:none}
.note{font-size:9px;color:#8d98a3;margin-top:4px}.resultTitle{font-size:21px;font-weight:1000;text-align:center}.resultText{text-align:center;font-size:12px;color:#cbd3da;margin:4px 0 7px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.action{font-size:13px;padding:11px;box-shadow:none}.secondary{background:#27313b;color:#fff}.tiny{text-align:center;font-size:9px;color:#7f8a94;margin-top:5px}
</style></head>
<body><div id="app">
<header><div class="brand">杯王陀螺 <span class="tag">V6 CUP KING</span></div><div class="king">👑 本機杯王<br><span id="kingText">尚未誕生</span></div></header>
<div id="hud"><div class="card"><span id="pName">🍵 茉香疾風</span> <span id="pPct">100%</span><div class="bar"><div class="fill" id="pFill"></div></div></div><div class="card"><span id="eName">🧋 黑糖重擊</span> <span id="ePct">100%</span><div class="bar"><div class="fill" id="eFill"></div></div></div></div>
<div id="arena"><canvas id="game"></canvas><div id="message"></div></div>
<div id="controls">
<button id="startBtn" class="big" type="button" onclick="Game.openSetup()">⚡ 挑戰杯王</button>
<div id="setup"><input id="nick" class="name" maxlength="8" placeholder="輸入暱稱（最多 8 字）" autocomplete="off">
<div class="drinks">
<button class="drink sel" data-id="green" type="button">🍵 茉香疾風<small>速度｜連擊</small></button>
<button class="drink" data-id="boba" type="button">🧋 黑糖重擊<small>攻擊｜重擊</small></button>
<button class="drink" data-id="winter" type="button">❄️ 寒天仙冬<small>耐久｜抗撞</small></button>
<button class="drink" data-id="mango" type="button">🥭 芒果爆旋<small>爆發｜X軌道</small></button>
</div><button id="confirmBtn" class="big" style="margin-top:7px" type="button" onclick="Game.prepare()">選這杯，準備發射</button></div>
<div id="launchPanel"><div>按住蓄力，放手發射</div><div class="powerText">POWER <span id="power">70</span>%</div><button id="launchBtn" type="button">按住 → 放手 GO SHOOT!</button><div class="note">約 0.5 秒接近滿力，不需要拖曳。</div></div>
<div id="result"><div id="resultTitle" class="resultTitle"></div><div id="resultText" class="resultText"></div><div class="actions"><button class="action" type="button" onclick="Game.share()">📣 分享戰績</button><button class="action secondary" type="button" onclick="Game.again()">🔥 再戰一場</button></div><div class="tiny">分享會帶上挑戰文字與遊戲網址；不同手機的店內總榜下一階段再接雲端。</div></div>
</div></div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var canvas=$("game"),ctx=canvas.getContext("2d"),msg=$("message"),startBtn=$("startBtn"),setup=$("setup"),launchPanel=$("launchPanel"),launchBtn=$("launchBtn"),result=$("result");
var powerText=$("power"),clockEl=null,pFill=$("pFill"),eFill=$("eFill"),pPct=$("pPct"),ePct=$("ePct"),pName=$("pName"),eName=$("eName"),kingText=$("kingText"),nick=$("nick");
var W=0,H=0,cx=0,cy=0,R=0,P=null,E=null,state="idle",last=0,timeLeft=20,particles=[],shake=0,slow=0,holdStart=0,holdTimer=0,power=70,selected="green",nextEngage=0,lastHitAt=0,startedAt=0,lastResult=null;
var DRINKS={
green:{name:"茉香疾風",icon:"🍵",speed:1.12,attack:.92,defense:1,endurance:1.03,rail:1.05},
boba:{name:"黑糖重擊",icon:"🧋",speed:.96,attack:1.2,defense:1.03,endurance:.98,rail:.95},
winter:{name:"寒天仙冬",icon:"❄️",speed:.92,attack:.88,defense:1.22,endurance:1.18,rail:.9},
mango:{name:"芒果爆旋",icon:"🥭",speed:1.08,attack:1.08,defense:.92,endurance:.94,rail:1.25}
};
function safeStoreGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function safeStoreSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function loadKing(){var s=safeStoreGet("cupKingV6");if(!s){kingText.textContent="尚未誕生";return;}try{var k=JSON.parse(s);kingText.textContent=k.nick+"｜"+k.wins+"連勝";}catch(e){kingText.textContent="尚未誕生";}}
function resize(){var r=canvas.getBoundingClientRect(),d=Math.min(3,window.devicePixelRatio||1);canvas.width=Math.max(1,Math.round(r.width*d));canvas.height=Math.max(1,Math.round(r.height*d));ctx.setTransform(d,0,0,d,0,0);W=r.width;H=r.height;cx=W/2;cy=H/2;R=W*.36;if(P&&state!=="battle")reset();}
function makeBey(x,y,type,id){var d=DRINKS[id];return{x:x,y:y,vx:0,vy:0,r:W*.052,spin:100,a:0,type:type,id:id,d:d,hit:0,rail:0,nearSave:0};}
function reset(){P=makeBey(cx-R*.48,cy,"p",selected);E=makeBey(cx+R*.48,cy,"e","boba");timeLeft=20;particles=[];shake=0;slow=0;lastHitAt=0;nextEngage=1.1;updateHud();}
function updateHud(){var ps=Math.max(0,Math.min(100,P.spin)),es=Math.max(0,Math.min(100,E.spin));pFill.style.width=ps+"%";eFill.style.width=es+"%";pPct.textContent=Math.floor(ps)+"%";ePct.textContent=Math.floor(es)+"%";pName.textContent=P.d.icon+" "+P.d.name;eName.textContent=E.d.icon+" "+E.d.name;}
function announce(s){msg.textContent=s;msg.className="";void msg.offsetWidth;msg.className="pop";}
function stadium(){ctx.save();if(shake>.1)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);var q=ctx.createRadialGradient(cx,cy,5,cx,cy,R*1.35);q.addColorStop(0,"#455461");q.addColorStop(.52,"#1a242d");q.addColorStop(.72,"#070a0e");q.addColorStop(.9,"#303c47");q.addColorStop(1,"#030405");ctx.fillStyle=q;ctx.beginPath();ctx.ellipse(cx,cy,R*1.23,R*1.08,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d9ff32";ctx.lineWidth=7;ctx.setLineDash([18,7]);ctx.beginPath();ctx.ellipse(cx,cy,R*.99,R*.87,0,.18,5.35);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle="rgba(255,255,255,.12)";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx-R*.8,cy-R*.62);ctx.lineTo(cx+R*.8,cy+R*.62);ctx.moveTo(cx+R*.8,cy-R*.62);ctx.lineTo(cx-R*.8,cy+R*.62);ctx.stroke();ctx.restore();}
function drawBey(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.a);var r=o.r,gr=ctx.createRadialGradient(-r*.3,-r*.3,1,0,0,r);var c=o.id==="green"?["#f1ffd8","#7ee23b","#163b29"]:o.id==="winter"?["#eefcff","#62c7ff","#16334b"]:o.id==="mango"?["#fff7c6","#ffbf2f","#6a3412"]:["#fff0c3","#e4822e","#512117"];gr.addColorStop(0,c[0]);gr.addColorStop(.27,c[1]);gr.addColorStop(.56,c[2]);gr.addColorStop(.78,"#d8dde0");gr.addColorStop(1,"#505961");ctx.fillStyle=gr;ctx.strokeStyle="#f5f6f7";ctx.lineWidth=2.5;ctx.beginPath();for(var i=0;i<16;i++){var a=i*Math.PI/8,rr=i%2?r*.7:r;if(i===0)ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);else ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle=c[1];ctx.beginPath();ctx.arc(0,0,r*.33,0,Math.PI*2);ctx.fill();ctx.restore();}
function sparks(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=2+Math.random()*7;particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:14+Math.random()*18});}}
function moveBey(o,dt){o.x+=o.vx*dt;o.y+=o.vy*dt;o.a+=(o.type==="p"?1:-1)*(.34+.21*o.spin/100)*dt;o.vx*=Math.pow(.996,dt);o.vy*=Math.pow(.996,dt);o.spin-=(.011/o.d.endurance+Math.hypot(o.vx,o.vy)*.00065)*dt;o.hit=Math.max(0,o.hit-dt);var dx=o.x-cx,dy=o.y-cy,ell=Math.sqrt((dx*dx)/(R*R*1.04)+(dy*dy)/(R*R*.82));
if(ell>.72&&ell<1.0&&o.spin>18){o.rail+=dt;if(o.rail>4){var d=Math.hypot(dx,dy)||1,tx=-dy/d,ty=dx/d,sg=o.type==="p"?1:-1;o.vx+=tx*.32*sg*o.d.rail*dt;o.vy+=ty*.32*sg*o.d.rail*dt;}}else{o.rail=0;}
if(ell>1&&ell<1.12){var d2=Math.hypot(dx,dy)||1,nx=dx/d2,ny=dy/d2,dot=o.vx*nx+o.vy*ny;if(dot>0){o.vx-=1.72*dot*nx;o.vy-=1.72*dot*ny;o.spin-=Math.max(.2,dot*.13/o.d.defense);if(dot>7&&o.nearSave<=0){o.nearSave=50;announce("😱 差一點出界!");}}}
o.nearSave=Math.max(0,o.nearSave-dt);if(ell>1.19)finish(o===E?"⚡ XTREME FINISH!":"RING OUT!",o===E,"ring");}
function director(elapsed){if(elapsed>=nextEngage&&state==="battle"){var dx=E.x-P.x,dy=E.y-P.y,d=Math.hypot(dx,dy)||1;var strength=elapsed<6?.75:elapsed<13?.95:1.15;P.vx+=dx/d*strength*P.d.speed;P.vy+=dy/d*strength*P.d.speed;E.vx-=dx/d*strength*.9;E.vy-=dy/d*strength*.9;nextEngage=elapsed+(1.45+Math.random()*1.15);}
if(elapsed>12){var dx2=P.x-cx,dy2=P.y-cy;P.vx-=dx2*.0008;P.vy-=dy2*.0008;dx2=E.x-cx;dy2=E.y-cy;E.vx-=dx2*.0008;E.vy-=dy2*.0008;}}
function collide(elapsed){var dx=E.x-P.x,dy=E.y-P.y,d=Math.hypot(dx,dy)||1;if(d<P.r+E.r&&P.hit<=0&&E.hit<=0){var nx=dx/d,ny=dy/d,rv=(E.vx-P.vx)*nx+(E.vy-P.vy)*ny,rel=Math.abs(rv),heavy=rel>7.2,imp=Math.max(4.2,rel);var pa=P.d.attack,ea=E.d.attack;P.vx-=nx*imp*.82*ea;P.vy-=ny*imp*.82*ea;E.vx+=nx*imp*.82*pa;E.vy+=ny*imp*.82*pa;
var pLoss=(heavy?2.3:.85)*ea/P.d.defense;var eLoss=(heavy?2.3:.85)*pa/E.d.defense;P.spin-=pLoss;E.spin-=eLoss;P.hit=E.hit=4.5;lastHitAt=elapsed;sparks((P.x+E.x)/2,(P.y+E.y)/2,heavy?42:20);shake=Math.min(16,imp*1.5);
if(heavy){slow=7;announce("💥 HEAVY SMASH!");try{if(navigator.vibrate)navigator.vibrate([35,18,55]);}catch(e){}if(elapsed>7&&imp>10.2&&Math.min(P.spin,E.spin)<32&&Math.random()<.18){finish("💥 BURST FINISH!",E.spin<P.spin,"burst");}}else{announce("CLASH!");try{if(navigator.vibrate)navigator.vibrate(18);}catch(e){}}}}
function updateParticles(){for(var i=particles.length-1;i>=0;i--){var q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.92;q.vy*=.92;q.l--;ctx.fillStyle=q.l%2?"#fff":"#d9ff32";ctx.fillRect(q.x,q.y,3.5,3.5);if(q.l<=0)particles.splice(i,1);}}
function finish(text,playerWon,kind){if(state!=="battle")return;state="done";var sec=Math.max(1,(performance.now()-startedAt)/1000);announce(text);var who=(nick.value||"神秘挑戰者").trim().slice(0,8)||"神秘挑戰者";var d=DRINKS[selected];lastResult={win:playerWon,nick:who,drink:d.name,icon:d.icon,finish:text,sec:sec.toFixed(1)};
if(playerWon){var old={nick:"",wins:0};try{var s=safeStoreGet("cupKingV6");if(s)old=JSON.parse(s);}catch(e){}var wins=old.nick===who?(Number(old.wins)||0)+1:1;safeStoreSet("cupKingV6",JSON.stringify({nick:who,wins:wins,drink:d.name}));loadKing();}
setTimeout(function(){result.style.display="block";$("resultTitle").textContent=playerWon?"🏆 "+who+" 挑戰成功！":"🔥 就差一下！再挑戰";$("resultText").textContent=d.icon+d.name+"｜"+text+"｜"+sec.toFixed(1)+" 秒";},650);}
function frame(ts){var raw=Math.min(2.2,(ts-last)/16.67||1);last=ts;var dt=slow>0?raw*.3:raw;if(slow>0)slow--;stadium();if(state==="battle"){timeLeft-=raw/60;var elapsed=20-timeLeft;moveBey(P,dt);moveBey(E,dt);director(elapsed);collide(elapsed);if(P.spin<=0)finish("SPIN FINISH!",false,"spin");else if(E.spin<=0)finish("SPIN FINISH!",true,"spin");else if(timeLeft<=0)finish(P.spin>=E.spin?"LAST SPIN!":"LAST SPIN!",P.spin>=E.spin,"time");updateHud();}drawBey(P);drawBey(E);updateParticles();shake*=.78;requestAnimationFrame(frame);}
function openSetup(){startBtn.style.display="none";result.style.display="none";setup.style.display="block";state="setup";}
function prepare(){selected=document.querySelector(".drink.sel").getAttribute("data-id");setup.style.display="none";launchPanel.style.display="block";reset();state="charge";power=70;powerText.textContent="70";announce("READY");}
function chargeStart(e){if(state!=="charge")return;if(e&&e.preventDefault)e.preventDefault();holdStart=performance.now();power=70;powerText.textContent="70";clearInterval(holdTimer);holdTimer=setInterval(function(){power=Math.min(100,70+(performance.now()-holdStart)/18);powerText.textContent=Math.floor(power);},30);}
function chargeEnd(e){if(state!=="charge"||!holdStart)return;if(e&&e.preventDefault)e.preventDefault();clearInterval(holdTimer);holdTimer=0;holdStart=0;launchPanel.style.display="none";result.style.display="none";state="battle";startedAt=performance.now();var pp=power/100,a=-.32+(Math.random()-.5)*.15,sp=(7.7+2.5*pp)*P.d.speed;P.spin=97+3*pp;E.spin=100;P.vx=Math.cos(a)*sp;P.vy=Math.sin(a)*sp;var ea=Math.PI+.27+(Math.random()-.5)*.2,es=8.6;E.vx=Math.cos(ea)*es;E.vy=Math.sin(ea)*es;nextEngage=.9;announce(power>94?"⚡ PERFECT SHOOT!":"GO SHOOT!");try{if(navigator.vibrate)navigator.vibrate([20,12,35]);}catch(ex){}}
function again(){result.style.display="none";openSetup();}
function share(){if(!lastResult)return;var r=lastResult,text=(r.win?"🏆 我成為杯王了！":"🔥 差一點成為杯王！")+"\n"+r.nick+"｜"+r.icon+r.drink+"\n"+r.finish+"｜"+r.sec+" 秒\n你敢來挑戰嗎？";var url=location.href.split("?")[0];if(navigator.share){navigator.share({title:"杯王陀螺挑戰",text:text,url:url}).catch(function(){});}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text+"\n"+url).then(function(){announce("📋 戰績已複製");}).catch(function(){announce("請截圖分享戰績");});}else{announce("📸 截圖分享戰績");}}
var drinkBtns=document.querySelectorAll(".drink");for(var i=0;i<drinkBtns.length;i++){drinkBtns[i].addEventListener("click",function(){for(var j=0;j<drinkBtns.length;j++)drinkBtns[j].classList.remove("sel");this.classList.add("sel");selected=this.getAttribute("data-id");});}
window.Game={openSetup:openSetup,prepare:prepare,share:share,again:again};
if(window.PointerEvent){launchBtn.addEventListener("pointerdown",chargeStart,{passive:false});launchBtn.addEventListener("pointerup",chargeEnd,{passive:false});launchBtn.addEventListener("pointercancel",chargeEnd,{passive:false});}else{launchBtn.addEventListener("touchstart",chargeStart,{passive:false});launchBtn.addEventListener("touchend",chargeEnd,{passive:false});launchBtn.addEventListener("mousedown",chargeStart,false);launchBtn.addEventListener("mouseup",chargeEnd,false);}
window.addEventListener("resize",resize);resize();reset();loadKing();requestAnimationFrame(frame);
})();
</script></body></html>
