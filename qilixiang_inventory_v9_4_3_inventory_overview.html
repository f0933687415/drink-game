 if(current.id==="wintermelon"){E("countChoices").classList.add("hide");E("manualCount").classList.add("hide");E("winterCount").classList.remove("hide");let total=Math.max(0,Math.round(current.stock*30));E("winterBoxes").value=Math.floor(total/30);E("winterPieces").value=total%30}
 else{E("winterCount").classList.add("hide");E("manualCount").classList.remove("hide");E("countChoices").classList.remove("hide");drawCount();E("manualCountQty").oninput=()=>{let v=Number(E("manualCountQty").value);if(Number.isFinite(v)&&v>=0){selected=v;E("countChoices").querySelectorAll("button").forEach(z=>z.classList.remove("sel"))}}}

function drawCount(){E("countChoices").innerHTML=options(current).map(q=>`<button class="${Math.abs(q-selected)<.0001?"sel":""}" data-q="${q}">${q} ${current.unit}</button>`).join("");E("countChoices").querySelectorAll("button").forEach(b=>b.onclick=()=>{selected=Number(b.dataset.q);E("manualCountQty").value="";drawCount()})}
function recordStructured(type,item,qty,extra={}){state.inventoryEvents.push({type,itemId:item.id,itemName:item.name,qty:Number(qty),unit:item.unit,ts:Date.now(),...extra});if(state.inventoryEvents.length>2000)state.inventoryEvents=state.inventoryEvents.slice(-2000)}
function learnFromCount(item,newQty){
 const prev=lastCountEvent(item.id);const now=Date.now();if(!prev)return null;
 const daysGap=(now-prev.ts)/86400000;if(daysGap<0.5)return null;
 const receipts=state.inventoryEvents.filter(e=>e.type==="receipt"&&e.itemId===item.id&&e.ts>prev.ts&&e.ts<=now).reduce((a,e)=>a+Number(e.qty||0),0);
 const used=Number(prev.qty)+receipts-Number(newQty);if(used<0)return null;
 const rate=used/daysGap;if(!Number.isFinite(rate))return null;
 if(!state.usageSamples[item.id])state.usageSamples[item.id]=[];state.usageSamples[item.id].push({ts:now,days:daysGap,used,rate});state.usageSamples[item.id]=state.usageSamples[item.id].slice(-8);
 const recent=state.usageSamples[item.id];const totalDays=recent.reduce((a,z)=>a+z.days,0),totalUsed=recent.reduce((a,z)=>a+z.used,0);item.daily=totalDays>0?totalUsed/totalDays:0;return {used,daysGap,rate};
}

 else{qty=Number(selected);if(!Number.isFinite(qty)||qty<0)return alert("請輸入正確庫存數量");label=`${qty}${current.unit}`}
 const learned=learnFromCount(current,qty);current.stock=qty;current.initialized=true;recordStructured("count",current,qty);log(`盤點 ${current.name} → ${label}${learned?`（本段耗用約${learned.used.toFixed(2)}${current.unit}）`:""}`);closeOverlay("countModal");render()
};

function selectR(id){rItem=state.items.find(x=>x.id==id);rQty=null;let qs=receiptRules[rItem.id]||[1,2,3];let displayUnit=rItem.unit;E("receiptName").textContent=`${rItem.name}・收到幾${displayUnit}？`;let quick="";if(rItem.id==="passion"||rItem.id==="mixed_juice"){E("receiptName").textContent=`${rItem.name}・1箱＝20罐`;quick=`<button data-q="20">1箱（20罐）</button>`}else{quick=qs.map(q=>`<button data-q="${q}">${q} ${displayUnit}</button>`).join("")}E("receiptQty").innerHTML=quick+`<div class="manual-receipt"><div class="muted" style="margin-bottom:7px">或手動輸入數量</div><div class="manual-row"><input id="manualReceiptQty" type="number" min="0" step="0.01" inputmode="decimal" placeholder="輸入數量"><span>${displayUnit}</span></div></div>`;E("receiptQty").querySelectorAll("button[data-q]").forEach(b=>b.onclick=()=>{rQty=Number(b.dataset.q);E("receiptQty").querySelectorAll("button[data-q]").forEach(z=>z.classList.remove("sel"));b.classList.add("sel");let i=E("manualReceiptQty");if(i)i.value=""});E("manualReceiptQty").oninput=()=>{let v=Number(E("manualReceiptQty").value);rQty=v>0?v:null;E("receiptQty").querySelectorAll("button[data-q]").forEach(z=>z.classList.remove("sel"))}}

function backupPayload(){return {format:"qilixiang-inventory-backup",schemaVersion:SCHEMA_VERSION,appVersion:"9.4.2",exportedAt:new Date().toISOString(),state}}
function safeStamp(){let d=new Date(),p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
function downloadBackup(prefix="七里香庫存備份"){let blob=new Blob([JSON.stringify(backupPayload(),null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`${prefix}_${safeStamp()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function dataSummary(){let counts=state.inventoryEvents.filter(e=>e.type==="count").length,receipts=state.inventoryEvents.filter(e=>e.type==="receipt").length,est=state.items.filter(isEstablished).length;E("dataSummary").innerHTML=`已建立庫存基準：<b>${est}/47 項</b><br>完整盤點事件：<b>${counts}</b>・收貨事件：<b>${receipts}</b><br>資料版本：${state.schemaVersion||1}・App V${state.appVersion||"9.4.2"}`}

E("restoreInput").onchange=async e=>{let f=e.target.files&&e.target.files[0];if(!f)return;try{let raw=JSON.parse(await f.text());if(raw.format!=="qilixiang-inventory-backup"||!raw.state||!Array.isArray(raw.state.items))throw new Error("格式不符");let incoming=raw.state;let ids=new Set(incoming.items.map(x=>x.id));let missing=defaults.filter(d=>!ids.has(d.id));if(missing.length)throw new Error(`備份缺少 ${missing.length} 個主檔品項`);if(!confirm(`要還原「${f.name}」嗎？\n還原前會先下載目前資料的救援備份。`))return;downloadBackup("還原前救援備份");const byId=new Map(incoming.items.map(x=>[x.id,x]));incoming.items=defaults.map(d=>({...d,...byId.get(d.id),cat:d.cat,unit:d.unit}));if(!Array.isArray(incoming.inventoryEvents))incoming.inventoryEvents=[];if(!incoming.usageSamples||typeof incoming.usageSamples!=="object")incoming.usageSamples={};if(!Array.isArray(incoming.events))incoming.events=[];incoming.schemaVersion=SCHEMA_VERSION;incoming.appVersion="9.4.3";state=incoming;save();dataSummary();render();alert("資料已還原完成。") }catch(err){alert("無法還原："+err.message)}};
