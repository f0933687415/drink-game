0">仙冬冰茶<b>$40</b></button><button class="drink" data-n="冬瓜檸檬" data-p="45">冬瓜檸檬<b>$45</b></button><button class="drink" data-n="冬瓜金桔" data-p="45">冬瓜金桔<b>$45</b></button><button class="drink" data-n="寒天仙冬冰茶" data-p="55">寒天仙冬冰茶<b>$55</b></button></div></section><section><h1>鮮果飲</h1><div class="grid"><button class="drink" data-n="金桔檸檬" data-p="50">金桔檸檬<b>$50</b></button><button class="drink" data-n="檸檬蜜茶" data-p="55">檸檬蜜茶<b>$55</b></button><button class="drink" data-n="鮮桔蜜茶" data-p="55">鮮桔蜜茶<b>$55</b></button><button class="drink" data-n="檸檬汁" data-p="50">檸檬汁<b>$50</b></button><button class="drink" data-n="水果茶" data-p="70">水果茶<b>$70</b></button></div></section><section><h1>養身飲</h1><div class="grid"><button class="drink" data-n="蜜茶" data-p="40">蜜茶<b>$40</b></button><button class="drink" data-n="仙楂洛神" data-p="45">仙楂洛神<b>$45</b></button><button class="drink" data-n="洛神檸檬" data-p="50">洛神檸檬<b>$50</b></button><button class="drink" data-n="黑糖薑母茶（季／500ml）" data-p="50">黑糖薑母茶（季／500ml）<b>$50</b></button><button class="drink" data-n="桂圓紅棗茶（季／500ml）" data-p="60">桂圓紅棗茶（季／500ml）<b>$60</b></button></div></section><section><h1>益菌多</h1><div class="grid"><button class="drink" data-n="綠茶多多" data-p="45">綠茶多多<b>$45</b></button><button class="drink" data-n="檸檬多多" data-p="60">檸檬多多<b>$60</b></button><button class="drink" data-n="百香多多" data-p="75">百香多多<b>$75</b></button></div></section></main>

<input id="cupNick" maxlength="20" placeholder="例如：阿明、小美" style="width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:16px">

</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><button id=continueBtn type=button style="padding:13px;border:1px solid #ccc;border-radius:12px;background:white;font-weight:bold">繼續加點</button><button id=sendBtn type=button style="padding:13px;border:0;border-radius:12px;background:#426a55;color:white;font-weight:bold">LINE 傳送訂單</button><button id=copyBtn type=button style="grid-column:1/-1;padding:11px;border:1px solid #ccc;border-radius:12px;background:white;font-weight:bold">複製訂單文字</button><a id="addLineBtn" href="https://line.me/ti/p/0kMejh4EPJ" style="grid-column:1/-1;text-align:center;padding:11px;border:1px solid #06c755;border-radius:12px;background:#fff;color:#06c755;font-weight:bold;text-decoration:none">第一次訂購？先加入店家 LINE</a></div></div></dialog>
<script>
const $=x=>document.querySelector(x),cart=[];let cur,q=1;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const LAST_KEY='qilixiang_last_order_v1',NICK_KEY='qilixiang_nickname_v1';
function loadMemory(){
 try{
  const nick=localStorage.getItem(NICK_KEY)||''; if(nick)$('#nickname').value=nick;
  const detail=$('#lastOrderDetail'); detail.textContent='完成一次訂單後，下次可快速加入';
  const last=JSON.parse(localStorage.getItem(LAST_KEY)||'null');
  if(last&&Array.isArray(last.items)&&last.items.length){
    const cups=last.items.reduce((a,x)=>a+(+x.q||1),0);
    const sum=last.items.reduce((a,x)=>a+(+x.p||0)*(+x.q||1),0);
    if(cups===1){
      const x=last.items[0];
      detail.textContent=(x.who?x.who+'｜':'')+x.n+'・'+x.s+'・'+x.i+(x.t&&x.t.length?'・＋'+x.t.join('＋'):'')+(x.note?'・備註：'+x.note:'');
    }else{
      detail.textContent='上次共 '+cups+' 杯｜$'+sum+'｜點一下整單加入';
    }
  }
 }catch(e){}
}
function saveLastOrder(){
 try{
  if(!cart.length)return;
  const items=cart.map(x=>({n:x.n,p:+x.p,q:+x.q,s:x.s,i:x.i,t:[...(x.t||[])],who:x.who||'',note:x.note||''}));
  localStorage.setItem(LAST_KEY,JSON.stringify({items,at:Date.now()}));
  localStorage.setItem(NICK_KEY,$('#nickname').value.trim());
 }catch(e){}
}
function addLastDrink(){
 try{
  const last=JSON.parse(localStorage.getItem(LAST_KEY)||'null');
  if(!last||!Array.isArray(last.items)||!last.items.length){alert('還沒有上次完成的訂單紀錄');return}
  last.items.forEach(x=>cart.push({n:x.n,p:+x.p,q:+x.q||1,s:x.s,i:x.i,t:[...(x.t||[])],who:x.who||'',note:x.note||''}));
  render();
  const cups=last.items.reduce((a,x)=>a+(+x.q||1),0);
  alert('已加入上次訂單，共 '+cups+' 杯');
 }catch(e){alert('無法讀取上次訂單紀錄')}
}
function radios(id,a,def){$(id).innerHTML=a.map(x=>`<label><input type=radio name="${id}" value="${x}" ${x==def?'checked':''}><span>${x}</span></label>`).join('')}
function sweetOptions(name){const w=['冬瓜茶','冬瓜紅','冬瓜綠','冬瓜青','仙冬冰茶','冬瓜檸檬','冬瓜金桔','寒天仙冬冰茶'],h=['蜜茶','仙楂洛神','洛神檸檬','黑糖薑母茶（季／500ml）','桂圓紅棗茶（季／500ml）'];if(w.includes(name))return [['多冬瓜','正常冬瓜','少冬瓜'],'正常冬瓜'];if(h.includes(name))return [['甜度固定'],'甜度固定'];return [['正常甜','八分糖','七分糖','五分糖','三分糖','一分糖','無糖'],'五分糖']}
function openD(b){cur=b;q=1;$('#q').textContent=1;$('#cupNick').value='';$('#cupNote').value='';$('#dn').textContent=b.dataset.n;$('#dp').textContent='$'+b.dataset.p;let sw=sweetOptions(b.dataset.n);radios('#sugar',sw[0],sw[1]);radios('#ice',['正常冰','少冰','微冰','去冰','常溫','溫','熱'],'少冰');$('#tops').innerHTML=[['黑白珍珠',10],['嫩仙草',10],['椰果',10],['咖啡凍',10],['寒天晶球',15],['統一布丁',15]].map(x=>`<label><input type=checkbox value="${x[0]}" data-p="${x[1]}"><span>${x[0]} +${x[1]}</span></label>`).join('');$('#dlg').showModal()}
document.querySelectorAll('.drink').forEach(b=>b.onclick=()=>openD(b));$('#close').onclick=()=>$('#dlg').close();$('#minus').onclick=()=>{q=Math.max(1,q-1);$('#q').textContent=q};$('#plus').onclick=()=>{q++;$('#q').textContent=q};
$('#add').onclick=()=>{let t=[...$('#tops').querySelectorAll(':checked')],extra=t.reduce((s,x)=>s+ +x.dataset.p,0),item={n:cur.dataset.n,p:+cur.dataset.p+extra,q,s:$('#sugar :checked').value,i:$('#ice :checked').value,t:t.map(x=>x.value),who:$('#cupNick').value.trim(),note:$('#cupNote').value.trim()};cart.push(item);$('#dlg').close();render()};
function render(){let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0);$('#badge').textContent=cups+'杯 $'+sum;$('#bar').textContent=cups+'杯｜$'+sum+'　確認訂單';$('#lines').innerHTML=cart.length?cart.map((x,i)=>`<div class=line><button onclick="cart.splice(${i},1);render()">刪除</button><b>${x.n} ×${x.q}</b><div class=meta>${x.who?'<b>'+esc(x.who)+'</b>｜':''}${x.s}／${x.i}${x.t.length?'／＋'+x.t.join('＋'):''}${x.note?'／備註：'+esc(x.note):''}</div><b>$${x.p*x.q}</b></div>`).join(''):'目前還沒有飲料。';$('#sum').textContent=cart.length?'共 '+cups+' 杯｜合計 $'+sum:''}

function showConfirm(){
 if(!cart.length){alert('請先加入飲料');return}
 let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0);
 let nick=$('#nickname').value.trim(); $('#confirmLines').innerHTML=(nick?'<div style="padding:10px 0;font-weight:bold">訂購人：'+nick.replace(/[<>&"]/g,'')+'</div>':'')+cart.map((x,i)=>`<div class=line>
 <button type=button onclick="cart.splice(${i},1);render();showConfirm()">刪除</button>
 <b>${x.who?esc(x.who)+'｜':''}${x.n} ×${x.q}</b><div class=meta>${x.s}／${x.i}${x.t.length?'／＋'+x.t.join('＋'):''}${x.note?'／備註：'+esc(x.note):''}</div>
 <div class=qty><button type=button onclick="if(cart[${i}].q>1)cart[${i}].q--;render();showConfirm()">−</button><strong>${x.q}</strong><button type=button onclick="cart[${i}].q++;render();showConfirm()">＋</button></div>
 <b>$${x.p*x.q}</b></div>`).join('');
 $('#confirmSum').innerHTML='<div id=sum style="font-size:20px;font-weight:bold;text-align:right;margin-top:12px">共 '+cups+' 杯｜合計 $'+sum+'</div>';
 if(!$('#confirmDlg').open) $('#confirmDlg').showModal();
}
$('#bar').onclick=()=>{try{localStorage.setItem(NICK_KEY,$('#nickname').value.trim())}catch(e){};showConfirm()};
$('#lastOrderBtn').onclick=addLastDrink;
loadMemory();
$('#confirmClose').onclick=()=>$('#confirmDlg').close();
$('#continueBtn').onclick=()=>$('#confirmDlg').close();
$('#sendBtn').onclick=()=>{ $('#confirmDlg').close(); $('#share').click(); };


function orderText(){
  const nick=$('#nickname').value.trim();
  let cups=cart.reduce((a,x)=>a+x.q,0),sum=cart.reduce((a,x)=>a+x.p*x.q,0);
  let text='【七里香大同店｜追加訂單】\n';
  if(nick) text+='訂購人：'+nick+'\n';
  const pickup=document.querySelector('input[name="pickup"]:checked');
  const payment=document.querySelector('input[name="payment"]:checked');
  text+='取餐：'+(pickup?pickup.value:'到店自取')+'\n';
  text+='付款：'+(payment?payment.value:'現金')+'\n';
  cart.forEach((x,i)=>{text+=(i+1)+'. '+(x.who?x.who+'｜':'')+x.n+' ×'+x.q+'｜'+x.s+'｜'+x.i+(x.t.length?'｜＋'+x.t.join('＋'):'')+(x.note?'｜備註：'+x.note:'')+'｜$'+(x.p*x.q)+'\n'});
  text+='共 '+cups+' 杯｜合計 $'+sum;
  return text;
}
async function copyOrder(){
  saveLastOrder(); loadMemory();
  const text=orderText();
  try{await navigator.clipboard.writeText(text);alert('訂單文字已複製，可以直接貼到 LINE')}catch(e){prompt('請複製訂單',text)}
}
function sendLine(){
  saveLastOrder(); loadMemory();
  const text=orderText();
  // LINE share URL opens LINE directly instead of iOS generic share sheet.
  location.href='https://line.me/R/share?text='+encodeURIComponent(text);
}
$('#sendBtn').onclick=sendLine;
$('#copyBtn').onclick=copyOrder;
$('#share').onclick=copyOrder;
</script></body></html>
