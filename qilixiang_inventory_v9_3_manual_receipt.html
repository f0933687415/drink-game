  cup700:[1,2,3,4],film:[1,2,3,4,5],straw_thick:[1,2],straw_thin:[1,2],bag1:Array.from({length:20},(_,i)=>i+1),bag2:Array.from({length:20},(_,i)=>i+1),bag4:Array.from({length:20},(_,i)=>i+1),bag6:Array.from({length:20},(_,i)=>i+1)
};
function selectR(id){rItem=state.items.find(x=>x.id==id);rQty=null;let qs=receiptRules[rItem.id]||[1,2,3];let displayUnit=rItem.unit;E("receiptName").textContent=`${rItem.name}・收到幾${displayUnit}？`;let quick="";if(rItem.id==="passion"||rItem.id==="mixed_juice"){E("receiptName").textContent=`${rItem.name}・1箱＝20罐`;quick=`<button data-q="20">1箱（20罐）</button>`}else{quick=qs.map(q=>`<button data-q="${q}">${q} ${displayUnit}</button>`).join("")}E("receiptQty").innerHTML=quick+`<div style="width:100%;margin-top:10px;padding-top:10px;border-top:1px solid #e5e7eb"><div class="muted" style="margin-bottom:7px">或手動輸入數量</div><div style="display:flex;gap:8px;align-items:center"><input id="manualReceiptQty" type="number" min="0" step="0.01" inputmode="decimal" placeholder="輸入數量" style="flex:1;min-width:0;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px"><span>${displayUnit}</span><button id="manualReceiptApply" type="button">套用</button></div></div>`;E("receiptQty").querySelectorAll("button[data-q]").forEach(b=>b.onclick=()=>{rQty=Number(b.dataset.q);E("receiptQty").querySelectorAll("button[data-q]").forEach(z=>z.classList.remove("sel"));b.classList.add("sel");let i=E("manualReceiptQty");if(i)i.value=""});E("manualReceiptApply").onclick=()=>{let v=Number(E("manualReceiptQty").value);if(!(v>0))return alert("請輸入大於 0 的數量");rQty=v;E("receiptQty").querySelectorAll("button[data-q]").forEach(z=>z.classList.remove("sel"))}}
E("receiptSave").onclick=()=>{if(!rItem||!rQty)return alert("請先選品項與數量");rItem.stock=+(rItem.stock+rQty).toFixed(2);log(`收貨 ${rItem.name} +${rQty}${rItem.unit}`);closeOverlay("receiptModal");render()};
E("cameraOpen").onclick=()=>E("cameraModal").style.display="flex";
function pick(){E("photoInput").value="";E("photoInput").click()}E("choosePhoto").onclick=pick;E("changePhoto").onclick=pick;
E("photoInput").onchange=e=>{let f=e.target.files&&e.target.files[0];if(!f)return;if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(f);E("preview").innerHTML="<img>";E("preview").querySelector("img").src=objUrl;E("choosePhoto").classList.add("hide");E("photoConfirm").classList.remove("hide");E("recognizeArea").classList.add("hide");E("ocrResult").classList.add("hide")};
E("confirmPhoto").onclick=()=>{E("photoConfirm").classList.add("hide");E("recognizeArea").classList.remove("hide")};
E("recognizeBtn").onclick=()=>{let a=[["高山青",2,"斤","green"],["古早紅",1,"斤","green"],["700ml 紙杯",2,"箱","warn"]];E("ocrLines").innerHTML=a.map((x,i)=>`<div class="ocrline"><input id="on${i}" value="${x[0]}"><input id="oq${i}" type="number" value="${x[1]}"><div class="badge ${x[3]}">${x[3]=="warn"?"確認":"高"}</div><input id="ou${i}" value="${x[2]}" hidden></div>`).join("");E("ocrResult").classList.remove("hide");E("ocrResult").scrollIntoView({behavior:"smooth"})};
E("ocrSave").onclick=()=>{let added=[];for(let i=0;i<3;i++){let name=E("on"+i).value.trim(),q=Number(E("oq"+i).value),unit=E("ou"+i).value,x=state.items.find(z=>z.name==name);if(x&&q>0){x.stock=+(x.stock+q).toFixed(2);added.push(`${name}+${q}${unit}`)}}if(!added.length)return alert("沒有找到可對應的庫存品項");log("拍單入庫 "+added.join("、"));closeOverlay("cameraModal");render()};
render();
})();
</script></body></html>
