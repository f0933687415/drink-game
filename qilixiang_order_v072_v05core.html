<!doctype html><html lang=zh-Hant><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><title>七里香大同店｜點餐測試</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f4ec;color:#292622;font-family:-apple-system,sans-serif}header{position:sticky;top:0;z-index:5;background:white;padding:14px;border-bottom:1px solid #ddd}header b{font-size:23px}#badge{float:right;background:#8d332d;color:white;padding:8px 11px;border-radius:20px}main,#cart{max-width:720px;margin:auto;padding:12px}main{padding-bottom:90px}h1{font-size:24px;margin:8px 0}h2{font-size:18px;margin:22px 0 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.drink{min-height:70px;text-align:left;border:1px solid #e1d8ca;background:white;border-radius:14px;padding:12px;font-size:14px}.drink em{display:block;color:#96362f;font-style:normal;font-weight:bold;margin-top:7px}dialog{width:min(94%,520px);border:0;border-radius:18px;padding:0}dialog::backdrop{background:#0008}.box{padding:17px}.box h3{font-size:22px;margin:0 0 8px}.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}label input{display:none}label span{display:block;text-align:center;border:1px solid #ddd;border-radius:10px;padding:10px 2px;font-size:12px}label input:checked+span{border:2px solid #96362f;color:#96362f;background:#fff2ee}.qty{display:flex;gap:15px;align-items:center;margin:10px 0}.qty button{width:42px;height:42px;border:0;border-radius:50%;font-size:20px}#add,#share{width:100%;border:0;border-radius:12px;padding:14px;background:#8d332d;color:white;font-weight:bold;font-size:16px}#close{float:right;border:0;background:#eee;border-radius:20px;width:34px;height:34px}.line{background:white;border:1px solid #e1d8ca;border-radius:12px;padding:11px;margin:7px 0}.line button{float:right}.meta{font-size:13px;color:#666;margin:4px 0}#sum{font-size:20px;font-weight:bold;text-align:right;margin:12px 0}.bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #ddd}.bottom #bar{display:block;width:100%;max-width:720px;margin:auto;text-align:center;color:white;background:#8d332d;padding:15px;border:0;border-radius:13px;font-weight:bold;font-size:17px}
</style><style>

</style></head><body><header><b>七里香</b> <small>高雄大同店｜功能測試</small><span id=badge>0杯 $0</span></header><div style="max-width:720px;margin:10px auto 4px;padding:0 12px"><label for="nickname" style="font-weight:bold">訂購人暱稱（選填）</label><input id="nickname" maxlength="20" placeholder="例如：阿明、王小姐、A組" style="width:100%;margin-top:6px;padding:12px;border:1px solid #ccc;border-radius:12px;font-size:16px"></div><main><section><h1>純茶本味</h1><div class="grid"><button class="drink" data-n="古早味紅茶" data-p="30">古早味紅茶<b>$30</b></button><button class="drink" data-n="茉香綠茶" data-p="30">茉香綠茶<b>$30</b></button><button class="drink" data-n="高山青茶" data-p="30">高山青茶<b>$30</b></button><button class="drink" data-n="桂花青茶" data-p="30">桂花青茶<b>$30</b></button><button class="drink" data-n="烏龍綠茶" data-p="30">烏龍綠茶<b>$30</b></button><button class="drink" data-n="決明大麥" data-p="30">決明大麥<b>$30</b></button><button class="drink" data-n="黃金烏龍茶（冷泡）" data-p="35">黃金烏龍茶（冷泡）<b>$35</b></button><button class="drink" data-n="紅玉紅茶" data-p="35">紅玉紅茶<b>$35</b></button><button class="drink" data-n="蕎麥茶" data-p="35">蕎麥茶<b>$35</b></button><button class="drink" data-n="日式玄米茶" data-p="35">日式玄米茶<b>$35</b></button><button class="drink" data-n="仙草甘茶" data-p="40">仙草甘茶<b>$40</b></button></div></section><section><h1>濃純鮮奶</h1><div class="grid"><button class="drink" data-n="奶蓋紅" data-p="50">奶蓋紅<b>$50</b></button><button class="drink" data-n="奶蓋綠" data-p="50">奶蓋綠<b>$50</b></button><button class="drink" data-n="奶蓋青" data-p="50">奶蓋青<b>$50</b></button><button class="drink" data-n="鮮奶紅" data-p="55">鮮奶紅<b>$55</b></button><button class="drink" data-n="鮮奶綠" data-p="55">鮮奶綠<b>$55</b></button><button class="drink" data-n="鮮奶青" data-p="55">鮮奶青<b>$55</b></button><button class="drink" data-n="冬瓜鮮奶" data-p="55">冬瓜鮮奶<b>$55</b></button><button class="drink" data-n="紅玉拿鐵" data-p="60">紅玉拿鐵<b>$60</b></button><button class="drink" data-n="仙草凍鮮奶茶" data-p="65">仙草凍鮮奶茶<b>$65</b></button><button class="drink" data-n="黑糖鮮奶茶" data-p="60">黑糖鮮奶茶<b>$60</b></button><button class="drink" data-n="珍珠鮮奶茶" data-p="65">珍珠鮮奶茶<b>$65</b></button><button class="drink" data-n="阿華田拿鐵" data-p="65">阿華田拿鐵<b>$65</b></button><button class="drink" data-n="咖啡拿鐵" data-p="65">咖啡拿鐵<b>$65</b></button><button class="drink" data-n="可可鮮奶" data-p="65">可可鮮奶<b>$65</b></button></div></section><section><h1>復刻奶香</h1><div class="grid"><button class="drink" data-n="奶茶" data-p="45">奶茶<b>$45</b></button><button class="drink" data-n="奶綠" data-p="45">奶綠<b>$45</b></button><button class="drink" data-n="奶青" data-p="45">奶青<b>$45</b></button><button class="drink" data-n="黑糖奶茶" data-p="50">黑糖奶茶<b>$50</b></button><button class="drink" data-n="日式玄米奶" data-p="50">日式玄米奶<b>$50</b></button><button class="drink" data-n="烏龍奶茶" data-p="50">烏龍奶茶<b>$50</b></button><button class="drink" data-n="雙色珍珠奶茶" data-p="55">雙色珍珠奶茶<b>$55</b></button><button class="drink" data-n="薄荷奶茶" data-p="55">薄荷奶茶<b>$55</b></button><button class="drink" data-n="阿華田" data-p="55">阿華田<b>$55</b></button><button class="drink" data-n="冰咖啡" data-p="55">冰咖啡<b>$55</b></button><button class="drink" data-n="可可亞" data-p="55">可可亞<b>$55</b></button><button class="drink" data-n="布丁奶茶" data-p="60">布丁奶茶<b>$60</b></button></div></section><section><h1>特調茶飲</h1><div class="grid"><button class="drink" data-n="梅子紅" data-p="40">梅子紅<b>$40</b></button><button class="drink" data-n="梅子綠" data-p="40">梅子綠<b>$40</b></button><button class="drink" data-n="梅子青" data-p="40">梅子青<b>$40</b></button><button class="drink" data-n="蜂蜜紅" data-p="45">蜂蜜紅<b>$45</b></button><button class="drink" data-n="蜂蜜綠" data-p="45">蜂蜜綠<b>$45</b></button><button class="drink" data-n="蜂蜜青" data-p="45">蜂蜜青<b>$45</b></button><button class="drink" data-n="檸檬紅" data-p="45">檸檬紅<b>$45</b></button><button class="drink" data-n="檸檬綠" data-p="45">檸檬綠<b>$45</b></button><button class="drink" data-n="檸檬青" data-p="45">檸檬青<b>$45</b></button><button class="drink" data-n="薄荷紅" data-p="50">薄荷紅<b>$50</b></button><button class="drink" data-n="薄荷綠" data-p="50">薄荷綠<b>$50</b></button><button class="drink" data-n="薄荷青" data-p="50">薄荷青<b>$50</b></button><button class="drink" data-n="脆梅綠茶" data-p="50">脆梅綠茶<b>$50</b></button><button class="drink" data-n="金鑽鳳梨青茶" data-p="50">金鑽鳳梨青茶<b>$50</b></button><button class="drink" data-n="鮮榨柳丁綠" data-p="65">鮮榨柳丁綠<b>$65</b></button><button class="drink" data-n="鮮果百香綠" data-p="65">鮮果百香綠<b>$65</b></button><button class="drink" data-n="香橙百香綠" data-p="70">香橙百香綠<b>$70</b></button></div></section><section><h1>現打果汁</h1><div class="grid"><button class="drink" data-n="西瓜汁" data-p="40">西瓜汁<b>$40</b></button><button class="drink" data-n="西瓜牛奶" data-p="50">西瓜牛奶<b>$50</b></button><button class="drink" data-n="香蕉牛奶" data-p="50">香蕉牛奶<b>$50</b></button><button class="drink" data-n="蘋果牛奶" data-p="55">蘋果牛奶<b>$55</b></button><button class="drink" data-n="綜合果汁" data-p="60">綜合果汁<b>$60</b></button><button class="drink" data-n="木瓜牛奶" data-p="65">木瓜牛奶<b>$65</b></button><button class="drink" data-n="芒果冰沙（季）" data-p="85">芒果冰沙（季）<b>$85</b></button><button class="drink" data-n="芒果牛奶（季）" data-p="90">芒果牛奶（季）<b>$90</b></button><button class="drink" data-n="草莓牛奶（季）" data-p="85">草莓牛奶（季）<b>$85</b></button></div></section><section><h1>古法冬瓜</h1><div class="grid"><button class="drink" data-n="冬瓜茶" data-p="30">冬瓜茶<b>$30</b></button><button class="drink" data-n="冬瓜紅" data-p="35">冬瓜紅<b>$35</b></button><button class="drink" data-n="冬瓜綠" data-p="35">冬瓜綠<b>$35</b></button><button class="drink" data-n="冬瓜青" data-p="35">冬瓜青<b>$35</b></button><button class="drink" data-n="仙冬冰茶" data-p="40">仙冬冰茶<b>$40</b></button><button class="drink" data-n="冬瓜檸檬" data-p="45">冬瓜檸檬<b>$45</b></button><button class="drink" data-n="冬瓜金桔" data-p="45">冬瓜金桔<b>$45</b></button><button class="drink" data-n="寒天仙冬冰茶" data-p="55">寒天仙冬冰茶<b>$55</b></button></div></section><section><h1>鮮果飲</h1><div class="grid"><button class="drink" data-n="金桔檸檬" data-p="50">金桔檸檬<b>$50</b></button><button class="drink" data-n="檸檬蜜茶" data-p="55">檸檬蜜茶<b>$55</b></button><button class="drink" data-n="鮮桔蜜茶" data-p="55">鮮桔蜜茶<b>$55</b></button><button class="drink" data-n="檸檬汁" data-p="50">檸檬汁<b>$50</b></button><button class="drink" data-n="水果茶" data-p="70">水果茶<b>$70</b></button></div></section><section><h1>養身飲</h1><div class="grid"><button class="drink" data-n="蜜茶" data-p="40">蜜茶<b>$40</b></button><button class="drink" data-n="仙楂洛神" data-p="45">仙楂洛神<b>$45</b></button><button class="drink" data-n="洛神檸檬" data-p="50">洛神檸檬<b>$50</b></button><button class="drink" data-n="黑糖薑母茶（季／500ml）" data-p="50">黑糖薑母茶（季／500ml）<b>$50</b></button><button class="drink" data-n="桂圓紅棗茶（季／500ml）" data-p="60">桂圓紅棗茶（季／500ml）<b>$60</b></button></div></section><section><h1>益菌多</h1><div class="grid"><button class="drink" data-n="綠茶多多" data-p="45">綠茶多多<b>$45</b></button><button class="drink" data-n="檸檬多多" data-p="60">檸檬多多<b>$60</b></button><button class="drink" data-n="百香多多" data-p="75">百香多多<b>$75</b></button></div></section></main>
<section id=cart style="display:none"><div id=lines></div><div id=sum></div><button id=share></button></section><div class=bottom><button id=bar type=button>0杯｜$0　確認訂單</button></div>
<dialog id=dlg><div class=box><button id=close>×</button><h3 id=dn></h3><b id=dp></b><h4>① 甜度</h4><div class=opts id=sugar></div><h4>② 冰塊</h4><div class=opts id=ice></div><h4>③ 加料</h4><div class=opts id=tops></div><h4>④ 杯數</h4><div class=qty><button id=minus>−</button><strong id=q>1</strong><button id=plus>＋</button></div><button id=add>＋ 加入訂單</button></div></dialog>
<dialog id=confirmDlg><div class=box><button id=confirmClose>×</button><h3>確認訂單</h3><div id=confirmLines></div><div id=confirmSum></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><button id=continueBtn type=button style="padding:13px;border:1px solid #ccc;border-radius:12px;background:white;font-weight:bold">繼續加點</button><button id=sendBtn type=button style="padding:13px;border:0;border-radius:12px;background:#426a55;color:white;font-weight:bold">送出／分享</button></div></div></dialog>
<script>
const $=x=>document.querySelector(x),cart=[];let cur,q=1;
function radios(id,a,def){$(id).innerHTML=a.map(x=>`<label><input type=radio name="${id}" value="${x}" ${x==def?'checked':''}><span>${x}</span></label>`).join('')}
function sweetOptions(name){const w=['冬瓜茶','冬瓜紅','冬瓜綠','冬瓜青','仙冬冰茶','冬瓜檸檬','冬瓜金桔','寒天仙冬冰茶'],h=['蜜茶','仙楂洛神','洛神檸檬','黑糖薑母茶（季／500ml）','桂圓紅棗茶（季／500ml）'];if(w.includes(name))return [['多冬瓜','正常冬瓜','少冬瓜'],'正常冬瓜'];if(h.includes(name))return [['甜度固定'],'甜度固定'];return [['正常甜','八分糖','五分糖','三分糖','無糖'],'五分糖']}
function openD(b){cur=b;q=1;$('#q').textContent=1;$('#dn').textContent=b.dataset.n;$('#dp').textContent='$'+b.dataset.p;let sw=sweetOptions(b.dataset.n);radios('#sugar',sw[0],sw[1]);radios('#ice',['正常冰','少冰','微冰','去冰','常溫','溫','熱'],'少冰');$('#tops').innerHTML=[['黑白珍珠',10],['嫩仙草',10],['椰果',10],['咖啡凍',10],['寒天晶球',15],['統一布丁',15]].map(x=>`<label><input type=checkbox value="${x[0]}" data-p="${x[1]}"><span>${x[0]} +${x[1]}</span></label>`).join('');$('#dlg').showModal()}
document.querySelectorAll('.drink').forEach(b=>b.onclick=()=>openD(b));$('#close').onclick=()=>$('#dlg').close();$('#minus').onclick=()=>{q=Math.max(1,q-1);$('#q').textContent=q};$('#plus').onclick=()=>{q++;$('#q').textContent=q};
$('#add').onclick=()=>{let t=[...$('#tops').querySelectorAll(':checked')],extra=t.reduce((s,x)=>s+ +x.dataset.p,0);cart.push({n:cur.dataset.n,p:+cur.dataset.p+extra,q,s:$('#sugar :checked').value,i:$('#ice :checked').value,t:t.map(x=>x.value)});$('#dlg').close();render()};
function render(){let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0);$('#badge').textContent=cups+'杯 $'+sum;$('#bar').textContent=cups+'杯｜$'+sum+'　確認訂單';$('#lines').innerHTML=cart.length?cart.map((x,i)=>`<div class=line><button onclick="cart.splice(${i},1);render()">刪除</button><b>${x.n} ×${x.q}</b><div class=meta>${x.s}／${x.i}${x.t.length?'／＋'+x.t.join('＋'):''}</div><b>$${x.p*x.q}</b></div>`).join(''):'目前還沒有飲料。';$('#sum').textContent=cart.length?'共 '+cups+' 杯｜合計 $'+sum:''}

function showConfirm(){
 if(!cart.length){alert('請先加入飲料');return}
 let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0);
 let nick=$('#nickname').value.trim(); $('#confirmLines').innerHTML=(nick?'<div style="padding:10px 0;font-weight:bold">訂購人：'+nick.replace(/[<>&"]/g,'')+'</div>':'')+cart.map((x,i)=>`<div class=line>
 <button type=button onclick="cart.splice(${i},1);render();showConfirm()">刪除</button>
 <b>${x.n} ×${x.q}</b><div class=meta>${x.s}／${x.i}${x.t.length?'／＋'+x.t.join('＋'):''}</div>
 <div class=qty><button type=button onclick="if(cart[${i}].q>1)cart[${i}].q--;render();showConfirm()">−</button><strong>${x.q}</strong><button type=button onclick="cart[${i}].q++;render();showConfirm()">＋</button></div>
 <b>$${x.p*x.q}</b></div>`).join('');
 $('#confirmSum').innerHTML='<div id=sum style="font-size:20px;font-weight:bold;text-align:right;margin-top:12px">共 '+cups+' 杯｜合計 $'+sum+'</div>';
 if(!$('#confirmDlg').open) $('#confirmDlg').showModal();
}
$('#bar').onclick=showConfirm;
$('#confirmClose').onclick=()=>$('#confirmDlg').close();
$('#continueBtn').onclick=()=>$('#confirmDlg').close();
$('#sendBtn').onclick=()=>{ $('#confirmDlg').close(); $('#share').click(); };

$('#share').onclick=async()=>{let nick=$('#nickname').value.trim();if(!cart.length)return alert('請先加入飲料');let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0),txt='【七里香大同店｜追加訂單】\n'+cart.map((x,i)=>(i+1)+'. '+x.n+' ×'+x.q+'\n　'+x.s+'／'+x.i+(x.t.length?'／＋'+x.t.join('＋'):'')+'　$'+x.p*x.q).join('\n')+'\n\n共 '+cups+' 杯｜合計 $'+sum;if(navigator.share)try{await navigator.share({text:txt})}catch(e){}else prompt('請複製訂單',txt)};
</script></body></html>
