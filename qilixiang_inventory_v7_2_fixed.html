<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>庫存 V7.2</title><style>
body{font-family:-apple-system,sans-serif;margin:0;background:#f4f5f1;color:#222}.app,.sheet{max-width:520px;margin:auto;padding:18px}.hero{background:#263029;color:white;padding:18px;border-radius:20px}.big{width:100%;border:0;border-radius:18px;padding:20px;margin-top:12px;text-align:left;background:#fff1bd;font-size:17px}.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:10;overflow:auto}.sheet{background:white;margin-top:8vh;border-radius:22px}.preview{min-height:200px;border:2px dashed #ccc;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:12px 0}.preview img{width:100%;max-height:330px;object-fit:contain}.btn{width:100%;padding:14px;border:0;border-radius:13px;margin-top:8px;background:#222;color:white;font-weight:700;font-size:16px}.green{background:#18703e}.light{background:#e8eae6;color:#222}.hide{display:none}.note{background:#fff2c7;padding:10px;border-radius:10px;font-size:12px;margin-top:12px}.row{display:grid;grid-template-columns:1.5fr .6fr;gap:7px;margin:7px 0}.row input{padding:9px;border:1px solid #ddd;border-radius:9px;width:100%;box-sizing:border-box}</style></head><body>
<div class="app"><small>七里香大同店</small><h1>今天要做什麼？</h1><div class="hero"><b>🚨 2 項需要注意</b><br><small>鮮奶建議補貨・1512珍珠接近安全線</small></div><button class="big" id="open">📷 <b>拍出貨單，自動入庫</b><br><small>拍照 → 確認照片 → 辨識 → 入庫</small></button><div id="history"><p>尚無入庫紀錄</p></div></div>
<div class="overlay" id="overlay"><div class="sheet"><h2>📷 拍出貨單</h2><p><small>拍完一定先預覽，確認後才進辨識。</small></p><div class="preview" id="preview">🧾 尚未選照片</div><input id="picker" type="file" accept="image/*" style="display:none">
<button class="btn" id="choose">拍照 / 選照片</button><div id="confirmArea" class="hide"><button class="btn green" id="confirm">✓ 確認使用這張照片</button><button class="btn light" id="again">重新拍 / 重選</button></div>
<div id="next" class="hide"><div class="note">✓ 照片已確認</div><button class="btn" id="recognize">開始辨識單據</button></div>
<div id="result" class="hide"><h3>辨識結果</h3><div class="note">此版先測手機流程，真正影像辨識尚未接後端；以下為示範結果。</div><input id="date" value="2026/09/18" style="padding:10px;width:100%;box-sizing:border-box;margin:10px 0"><div id="lines"></div><button class="btn green" id="save">確認資料並入庫</button></div><button class="btn light" id="close">關閉</button></div></div>
<script>
const E=id=>document.getElementById(id);let rec=JSON.parse(localStorage.getItem("v72rec")||"[]"),objUrl="";
E("open").onclick=()=>E("overlay").style.display="block";E("close").onclick=()=>E("overlay").style.display="none";
function pick(){E("picker").value="";E("picker").click()} E("choose").onclick=pick;E("again").onclick=pick;
E("picker").onchange=e=>{let f=e.target.files[0];if(!f)return;if(objUrl)URL.revokeObjectURL(objUrl);objUrl=URL.createObjectURL(f);E("preview").innerHTML="<img>";E("preview").querySelector("img").src=objUrl;E("choose").classList.add("hide");E("confirmArea").classList.remove("hide");E("next").classList.add("hide");E("result").classList.add("hide")};
E("confirm").onclick=()=>{E("confirmArea").classList.add("hide");E("next").classList.remove("hide")};
E("recognize").onclick=()=>{let a=[["青茶 1斤4包",10],["綠茶 1斤4包",5],["台糖黑糖3kg",1],["700紙杯",2]];E("lines").innerHTML=a.map((x,i)=>'<div class="row"><input id="n'+i+'" value="'+x[0]+'"><input id="q'+i+'" type="number" value="'+x[1]+'"></div>').join("");E("result").classList.remove("hide")};
E("save").onclick=()=>{let a=[];for(let i=0;i<4;i++)a.push({name:E("n"+i).value,qty:E("q"+i).value});rec.push({date:E("date").value,items:a});localStorage.setItem("v72rec",JSON.stringify(rec));render();E("overlay").style.display="none"};
function render(){E("history").innerHTML=rec.length?"<h3>最近入庫</h3>"+rec.slice().reverse().map(r=>"<p><b>"+r.date+"</b>　"+r.items.map(x=>x.name+" "+x.qty).join("・")+"</p>").join(""):"<p>尚無入庫紀錄</p>"}render();
</script></body></html>
