<script>
const $=x=>document.querySelector(x),cart=[];let cur,q=1;
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const LAST_KEY='qilixiang_last_order_v1',NICK_KEY='qilixiang_nickname_v1';
async function relayEncode(obj){
 const raw=new TextEncoder().encode(JSON.stringify(obj));
 if(typeof CompressionStream==='undefined'){
  let bin='';raw.forEach(b=>bin+=String.fromCharCode(b));
  return 'u'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 }
 const cs=new CompressionStream('gzip');
 const compressed=await new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer();
 let bin='';new Uint8Array(compressed).forEach(b=>bin+=String.fromCharCode(b));
 return 'g'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function relayDecode(v){
 const mode=v[0],data=v.slice(1);
 let b=data.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
 const bin=atob(b),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
 if(mode==='g'){
  const ds=new DecompressionStream('gzip');
  const raw=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
  return JSON.parse(new TextDecoder().decode(raw));
 }
 return JSON.parse(new TextDecoder().decode(bytes));
}
function relayData(){
 return {items:cart.map(x=>({n:x.n,p:+x.p,q:+x.q,s:x.s,i:x.i,t:[...(x.t||[])],who:x.who||'',note:x.note||''}))};
}
async function shareRelay(){
 if(!cart.length){alert('請先加入飲料');return}
 const u=new URL(location.href);u.search='';
 u.hash='r='+await relayEncode(relayData());
 const url=u.toString();
 try{
   if(navigator.share){await navigator.share({title:'七里香接力點餐',url});return}
 }catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(url);alert('接力連結已複製，貼到 LINE 傳給下一位即可')}
 catch(e){prompt('複製這個連結傳給下一位',url)}
}
async function loadRelay(){
 let token='';
 if(location.hash.startsWith('#r='))token=location.hash.slice(3);
 else if(location.hash.startsWith('#relay=')){ // 相容 V0.8.2 舊連結
   try{
    const old=location.hash.slice(7);
    let b=old.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    const bin=atob(b),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const d=JSON.parse(new TextDecoder().decode(bytes));
    if(d&&Array.isArray(d.items)&&d.items.length){
      cart.splice(0,cart.length,...d.items.map(x=>({n:x.n,p:+x.p,q:+x.q||1,s:x.s,i:x.i,t:[...(x.t||[])],who:x.who||'',note:x.note||''})));
      $('#relayBanner').style.display='block';render();history.replaceState(null,'',location.pathname+location.search);return;
    }
   }catch(e){}
 }
 if(!token)return;
 try{
  const d=await relayDecode(token);
  if(!d||!Array.isArray(d.items)||!d.items.length)throw new Error('empty');
  cart.splice(0,cart.length,...d.items.map(x=>({n:x.n,p:+x.p,q:+x.q||1,s:x.s,i:x.i,t:[...(x.t||[])],who:x.who||'',note:x.note||''})));
  $('#relayBanner').style.display='block';
  render();

function loadMemory(){
 try{
  const nick=localStorage.getItem(NICK_KEY)||''; if(nick)$('#nickname').value=nick;
  const detail=$('#lastOrderDetail'); detail.textContent='完成一次訂單後，下次可快速加入';
  const last=JSON.parse(localStorage.getItem(LAST_KEY)||'null');
  if(last&&Array.isArray(last.items)&&last.items.length){
    const cups=last.items.reduce((a,x)=>a+(+x.q||1),0);
    const sum=last.items.reduce((a,x)=>a+(+x.p||0)*(+x.q||1),0);
    if(cups===1){
      const x=last.items[0];
      detail.textContent=(x.who?x.who+'｜':'')+x.n+'・'+x.s+'・'+x.i+(x.t&&x.t.length?'・＋'+x.t.join('＋'):'')+(x.note?'・備註：'+x.note:'');
    }else{
      detail.textContent='上次共 '+cups+' 杯｜$'+sum+'｜點一下整單加入';
    }
  }
 }catch(e){}
}
function saveLastOrder(){
 try{
  if(!cart.length)return;
  const items=cart.map(x=>({n:x.n,p:+x.p,q:+x.q,s:x.s,i:x.i,t:[...(x.t||[])],who:x.who||'',note:x.note||''}));
  localStorage.setItem(LAST_KEY,JSON.stringify({items,at:Date.now()}));
  localStorage.setItem(NICK_KEY,$('#nickname').value.trim());
 }catch(e){}
}
function addLastDrink(){
 try{
  const last=JSON.parse(localStorage.getItem(LAST_KEY)||'null');
  if(!last||!Array.isArray(last.items)||!last.items.length){alert('還沒有上次完成的訂單紀錄');return}
  last.items.forEach(x=>cart.push({n:x.n,p:+x.p,q:+x.q||1,s:x.s,i:x.i,t:[...(x.t||[])],who:x.who||'',note:x.note||''}));
  render();
  const cups=last.items.reduce((a,x)=>a+(+x.q||1),0);
  alert('已加入上次訂單，共 '+cups+' 杯');
 }catch(e){alert('無法讀取上次訂單紀錄')}
}

document.querySelectorAll('.drink').forEach(b=>b.onclick=()=>openD(b));$('#close').onclick=()=>$('#dlg').close();$('#minus').onclick=()=>{q=Math.max(1,q-1);$('#q').textContent=q};$('#plus').onclick=()=>{q++;$('#q').textContent=q};
$('#add').onclick=()=>{let t=[...$('#tops').querySelectorAll(':checked')],extra=t.reduce((s,x)=>s+ +x.dataset.p,0),item={n:cur.dataset.n,p:+cur.dataset.p+extra,q,s:$('#sugar :checked').value,i:$('#ice :checked').value,t:t.map(x=>x.value),who:$('#cupNick').value.trim(),note:$('#cupNote').value.trim()};cart.push(item);$('#dlg').close();render()};
function render(){let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0);$('#badge').textContent=cups+'杯 $'+sum;$('#bar').textContent=cups+'杯｜$'+sum+'　確認訂單';$('#lines').innerHTML=cart.length?cart.map((x,i)=>`<div class=line><button onclick="cart.splice(${i},1);render()">刪除</button><b>${x.n} ×${x.q}</b><div class=meta>${x.who?'<b>'+esc(x.who)+'</b>｜':''}${x.s}／${x.i}${x.t.length?'／＋'+x.t.join('＋'):''}${x.note?'／備註：'+esc(x.note):''}</div><b>$${x.p*x.q}</b></div>`).join(''):'目前還沒有飲料。';$('#sum').textContent=cart.length?'共 '+cups+' 杯｜合計 $'+sum:''}

function showConfirm(){
 if(!cart.length){alert('請先加入飲料');return}
 let cups=cart.reduce((s,x)=>s+x.q,0),sum=cart.reduce((s,x)=>s+x.p*x.q,0);
 let nick=$('#nickname').value.trim(); $('#confirmLines').innerHTML=(nick?'<div style="padding:10px 0;font-weight:bold">訂購人：'+nick.replace(/[<>&"]/g,'')+'</div>':'')+cart.map((x,i)=>`<div class=line>
 <button type=button onclick="cart.splice(${i},1);render();showConfirm()">刪除</button>
 <b>${x.who?esc(x.who)+'｜':''}${x.n} ×${x.q}</b><div class=meta>${x.s}／${x.i}${x.t.length?'／＋'+x.t.join('＋'):''}${x.note?'／備註：'+esc(x.note):''}</div>
 <div class=qty><button type=button onclick="if(cart[${i}].q>1)cart[${i}].q--;render();showConfirm()">−</button><strong>${x.q}</strong><button type=button onclick="cart[${i}].q++;render();showConfirm()">＋</button></div>
 <b>$${x.p*x.q}</b></div>`).join('');
 $('#confirmSum').innerHTML='<div id=sum style="font-size:20px;font-weight:bold;text-align:right;margin-top:12px">共 '+cups+' 杯｜合計 $'+sum+'</div>';
 if(!$('#confirmDlg').open) $('#confirmDlg').showModal();
}

function orderText(){
 const nick=$('#nickname').value.trim();
 const pickup=document.querySelector('input[name="pickup"]:checked')?.value||'到店自取';
 const pay=document.querySelector('input[name="pay"]:checked')?.value||'現金';
 let text='【七里香大同店｜追加訂單】\n';
 if(nick)text+='訂購人：'+nick+'\n';
 text+=pickup+'｜'+pay+'\n\n';

 cart.forEach((x,i)=>{
   const itemTotal=x.p*x.q;
   text+=(i+1)+'. '+(x.who?x.who+'｜':'')+x.n+' ×'+x.q+'　$'+itemTotal+'\n';
   text+='   '+x.s+'・'+x.i+'\n';
   if(x.t&&x.t.length)text+='   ＋'+x.t.join('・＋')+'\n';
   if(x.note)text+='   📌 '+x.note+'\n';
   text+='\n';
 });
 text+='─────────\n';
 text+='共 '+cart.reduce((a,x)=>a+x.q,0)+' 杯｜合計 $'+cart.reduce((a,x)=>a+x.p*x.q,0);
 return text;
}
function sendLine(){
  saveLastOrder(); loadMemory();
  const text=orderText();
  // LINE share URL opens LINE directly instead of iOS generic share sheet.
  location.href='https://line.me/R/share?text='+encodeURIComponent(text);
}
$('#sendBtn').onclick=sendLine;
$('#copyBtn').onclick=copyOrder;
$('#share').onclick=copyOrder;
